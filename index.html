<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1565C0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lembretes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Meus Lembretes</title>
  <style>
    :root {
      --cor-fundo: #F5F7FA;
      --cor-texto: #1A1A1A;
      --cor-azul: #1565C0;
      --cor-azul-escuro: #0D47A1;
      --cor-vermelho: #C62828;
      --cor-verde-fundo: #E8F5E9;
      --cor-verde-texto: #1B5E20;
      --cor-alerta-fundo: #FFF3E0;
      --cor-alerta-texto: #E65100;
      --fonte-base: clamp(24px, 5.5vw, 28px);
      --fonte-grande: clamp(30px, 7vw, 38px);
      --fonte-titulo: clamp(26px, 6vw, 32px);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      height: 100%;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: var(--fonte-base);
      line-height: 1.45;
      color: var(--cor-texto);
      background: var(--cor-fundo);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding:
        calc(16px + var(--safe-top))
        calc(16px + var(--safe-right))
        calc(16px + var(--safe-bottom))
        calc(16px + var(--safe-left));
    }

    .app {
      width: 100%;
      max-width: 600px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      text-align: center;
    }

    .instrucao {
      font-size: var(--fonte-grande);
      font-weight: 600;
      margin: 0;
      max-width: 28ch;
    }

    .area-mensagem {
      width: 100%;
      padding: 1rem 1.25rem;
      border-radius: 16px;
      min-height: 3rem;
    }

    .area-mensagem--neutra { background: transparent; }
    .area-mensagem--sucesso {
      background: var(--cor-verde-fundo);
      color: var(--cor-verde-texto);
    }
    .area-mensagem--alerta {
      background: var(--cor-alerta-fundo);
      color: var(--cor-alerta-texto);
    }

    .mensagem-principal {
      font-size: var(--fonte-grande);
      font-weight: 600;
      margin: 0 0 0.5rem;
    }

    .mensagem-ouvi {
      font-size: var(--fonte-base);
      font-weight: 400;
      margin: 0;
      opacity: 0.9;
    }

    .icone-sucesso {
      font-size: clamp(48px, 12vw, 64px);
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .cronometro {
      font-size: clamp(40px, 10vw, 56px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin: 0;
      letter-spacing: 0.02em;
    }

    .btn-principal {
      width: min(72vw, 280px);
      height: min(72vw, 280px);
      min-width: 220px;
      min-height: 220px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #fff;
      font-size: clamp(20px, 4.5vw, 24px);
      font-weight: 600;
      font-family: inherit;
      transition: transform 0.15s ease, background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-principal:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-principal--pronto {
      background: var(--cor-azul);
      box-shadow: 0 8px 24px rgba(21, 101, 192, 0.35);
    }

    .btn-principal--pronto:focus-visible {
      outline: 4px solid #90CAF9;
      outline-offset: 4px;
    }

    .btn-principal--gravando {
      background: var(--cor-vermelho);
      box-shadow: 0 8px 24px rgba(198, 40, 40, 0.35);
    }

    @media (prefers-reduced-motion: no-preference) {
      .btn-principal--gravando {
        animation: pulsar 1.6s ease-in-out infinite;
      }
    }

    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .btn-principal--enviando {
      background: #78909C;
      cursor: not-allowed;
      opacity: 0.95;
    }

    .btn-principal:disabled {
      cursor: not-allowed;
    }

    .btn-icone-mic {
      width: clamp(56px, 14vw, 72px);
      height: clamp(56px, 14vw, 72px);
      fill: currentColor;
    }

    .spinner {
      width: 56px;
      height: 56px;
      border: 5px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: girar 0.9s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: rgba(255,255,255,0.8); }
    }

    @keyframes girar {
      to { transform: rotate(360deg); }
    }

    .btn-secundario {
      margin-top: 0.5rem;
      padding: 1rem 1.75rem;
      font-size: var(--fonte-base);
      font-weight: 600;
      font-family: inherit;
      border: 2px solid var(--cor-azul);
      background: #fff;
      color: var(--cor-azul);
      border-radius: 999px;
      cursor: pointer;
      min-height: 56px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-secundario:focus-visible {
      outline: 3px solid #90CAF9;
      outline-offset: 2px;
    }

    .btn-topo {
      align-self: stretch;
      max-width: 100%;
      padding: 0.85rem 1.25rem;
      font-size: var(--fonte-base);
      font-weight: 600;
      font-family: inherit;
      border: 2px solid var(--cor-azul);
      background: #fff;
      color: var(--cor-azul);
      border-radius: 14px;
      cursor: pointer;
      min-height: 52px;
    }

    .painel-lista {
      width: 100%;
      text-align: left;
    }

    .painel-lista h2 {
      font-size: var(--fonte-grande);
      margin: 0 0 1rem;
      text-align: center;
    }

    .lista-vazia {
      text-align: center;
      font-size: var(--fonte-base);
      color: #546E7A;
    }

    .item-lembrete {
      background: #fff;
      border: 2px solid #CFD8DC;
      border-radius: 14px;
      padding: 1rem 1.125rem;
      margin-bottom: 0.85rem;
    }

    .item-lembrete__data {
      font-size: clamp(20px, 4.5vw, 24px);
      font-weight: 700;
      color: var(--cor-azul);
      margin: 0 0 0.35rem;
    }

    .item-lembrete__tarefa {
      font-size: var(--fonte-base);
      margin: 0 0 0.75rem;
    }

    .btn-excluir {
      width: 100%;
      padding: 0.75rem;
      font-size: clamp(20px, 4.5vw, 22px);
      font-weight: 600;
      font-family: inherit;
      border: 2px solid var(--cor-vermelho);
      background: #fff;
      color: var(--cor-vermelho);
      border-radius: 12px;
      cursor: pointer;
      min-height: 52px;
    }

    .passos-mic {
      text-align: left;
      max-width: 32ch;
      margin: 0 auto;
      font-size: var(--fonte-base);
    }

    .passos-mic ol {
      margin: 0.5rem 0 0;
      padding-left: 1.25rem;
    }

    .passos-mic li { margin-bottom: 0.5rem; }

    .modo-teste {
      width: 100%;
      max-width: 400px;
      display: none;
    }

    .modo-teste.ativo { display: block; }

    .modo-teste label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: var(--fonte-base);
    }

    .modo-teste textarea {
      width: 100%;
      min-height: 100px;
      font-size: var(--fonte-base);
      font-family: inherit;
      padding: 0.75rem;
      border-radius: 12px;
      border: 2px solid #B0BEC5;
    }

    .modo-teste .btn-secundario { width: 100%; }

    .aviso-teste {
      font-size: 18px;
      color: #546E7A;
      margin: 0 0 0.75rem;
    }

    .oculto { display: none !important; }

    .tela-senha {
      width: 100%;
      max-width: 600px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      text-align: center;
    }

    .tela-senha__titulo {
      font-size: var(--fonte-grande);
      font-weight: 600;
      margin: 0;
      max-width: 22ch;
    }

    .campo-senha {
      width: 100%;
      max-width: 320px;
      font-size: var(--fonte-base);
      font-family: inherit;
      padding: 1rem 1.125rem;
      border-radius: 14px;
      border: 2px solid #78909C;
      min-height: 56px;
    }

    .campo-senha:focus {
      outline: 3px solid #90CAF9;
      outline-offset: 2px;
      border-color: var(--cor-azul);
    }

    .erro-senha {
      color: var(--cor-alerta-texto);
      font-weight: 600;
      margin: 0;
      min-height: 1.5em;
    }

    .btn-entrar {
      padding: 1rem 2.5rem;
      font-size: var(--fonte-base);
      font-weight: 600;
      font-family: inherit;
      border: none;
      background: var(--cor-azul);
      color: #fff;
      border-radius: 999px;
      cursor: pointer;
      min-height: 56px;
      min-width: 200px;
      box-shadow: 0 6px 18px rgba(21, 101, 192, 0.3);
    }

    .btn-entrar:focus-visible {
      outline: 4px solid #90CAF9;
      outline-offset: 3px;
    }

    .aviso-config {
      font-size: var(--fonte-base);
      color: var(--cor-alerta-texto);
      max-width: 36ch;
    }

    .cabecalho {
      width: 100%;
      text-align: center;
      margin-bottom: 0.25rem;
    }

    .cabecalho__titulo {
      font-size: var(--fonte-titulo);
      font-weight: 700;
      margin: 0;
      color: var(--cor-azul-escuro);
    }

    .cabecalho__sub {
      margin: 0.35rem 0 0;
      font-size: clamp(18px, 4vw, 22px);
      color: #455A64;
    }

    .faixa-ambiente {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      background: #E3F2FD;
      color: #0D47A1;
      font-size: clamp(20px, 4.5vw, 24px);
      font-weight: 600;
      text-align: left;
      border: 2px solid #90CAF9;
    }

    .transcricao-ao-vivo {
      width: 100%;
      padding: 1rem 1.125rem;
      background: #fff;
      border: 2px dashed #EF5350;
      border-radius: 14px;
      font-size: var(--fonte-base);
      min-height: 3.5rem;
      text-align: left;
      color: #37474F;
    }

    .transcricao-ao-vivo__rotulo {
      display: block;
      font-weight: 700;
      color: var(--cor-vermelho);
      margin-bottom: 0.35rem;
      font-size: clamp(20px, 4.5vw, 24px);
    }

    .passo-gravacao {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .passo-gravacao span {
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: #ECEFF1;
      font-size: clamp(18px, 4vw, 22px);
      font-weight: 600;
    }

    .passo-gravacao span.ativo {
      background: #FFEBEE;
      color: var(--cor-vermelho);
      border: 2px solid var(--cor-vermelho);
    }

    .btn-digitar-toggle {
      width: 100%;
      padding: 0.9rem 1rem;
      font-size: var(--fonte-base);
      font-weight: 600;
      font-family: inherit;
      border: 2px dashed var(--cor-azul);
      background: #fff;
      color: var(--cor-azul);
      border-radius: 14px;
      cursor: pointer;
      min-height: 56px;
    }

    .painel-digitar {
      width: 100%;
      text-align: left;
    }

    .painel-digitar textarea {
      width: 100%;
      min-height: 120px;
      font-size: var(--fonte-base);
      font-family: inherit;
      padding: 1rem;
      border-radius: 14px;
      border: 2px solid #78909C;
      margin-bottom: 0.75rem;
    }

    .painel-digitar .btn-secundario { width: 100%; }

    .cartao-confirmacao {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 2px solid #81C784;
      border-radius: 16px;
      padding: 1.125rem 1.25rem;
      margin-bottom: 0.75rem;
    }

    .cartao-confirmacao__titulo {
      margin: 0 0 0.5rem;
      font-size: clamp(22px, 5vw, 28px);
      text-align: center;
      color: var(--cor-texto);
    }

    .cartao-confirmacao dt {
      font-weight: 700;
      color: var(--cor-azul);
      margin-top: 0.75rem;
      font-size: clamp(20px, 4.5vw, 24px);
    }

    .cartao-confirmacao dt:first-child { margin-top: 0; }

    .cartao-confirmacao dd {
      margin: 0.25rem 0 0;
      font-size: var(--fonte-base);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + var(--safe-bottom));
      transform: translateX(-50%);
      max-width: min(560px, calc(100vw - 32px));
      padding: 1rem 1.25rem;
      border-radius: 14px;
      font-size: var(--fonte-base);
      font-weight: 600;
      z-index: 1000;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
      text-align: center;
    }

    .toast--ok { background: var(--cor-verde-texto); color: #fff; }
    .toast--alerta { background: var(--cor-alerta-texto); color: #fff; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2000;
    }

    .modal-caixa {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .modal-caixa p {
      font-size: var(--fonte-grande);
      margin: 0 0 1.25rem;
    }

    .modal-acoes {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .btn-principal-texto {
      width: 100%;
      min-height: 58px;
      border-radius: 14px;
      border: none;
      font-size: var(--fonte-base);
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    .btn-principal-texto--sim {
      background: var(--cor-azul);
      color: #fff;
    }

    .btn-principal-texto--nao {
      background: #fff;
      color: var(--cor-texto);
      border: 2px solid #90A4AE;
    }
  </style>
</head>
<body>
  <section class="tela-senha" id="telaSenha" aria-labelledby="tituloSenha">
    <h1 class="tela-senha__titulo" id="tituloSenha">Digite a senha para entrar</h1>
    <p class="erro-senha" id="erroSenha" aria-live="polite"></p>
    <p class="aviso-config oculto" id="avisoConfig"></p>
    <form id="formSenha" class="tela-senha" style="width:100%;max-width:400px;gap:1rem;" autocomplete="on">
      <input type="text" name="username" autocomplete="username" value="lembretes" class="oculto" tabindex="-1" aria-hidden="true">
      <input
        type="password"
        class="campo-senha"
        id="inputSenha"
        name="senha"
        autocomplete="current-password"
        aria-label="Senha de acesso"
        inputmode="text"
      >
      <button type="submit" class="btn-entrar" id="btnEntrar">Entrar</button>
    </form>
  </section>

  <main class="app oculto" id="app" aria-hidden="true">
    <header class="cabecalho">
      <h1 class="cabecalho__titulo">Meus Lembretes</h1>
      <p class="cabecalho__sub">Toque, fale, confirme. Simples assim.</p>
    </header>
    <div class="faixa-ambiente oculto" id="faixaAmbiente" role="status"></div>
    <button type="button" class="btn-topo oculto" id="btnVerLembretes">Ver meus lembretes</button>
    <p class="instrucao" id="instrucao"></p>
    <div class="passo-gravacao oculto" id="passosGravacao" aria-hidden="true">
      <span id="passo1">1. Toque</span>
      <span id="passo2">2. Fale</span>
      <span id="passo3">3. Toque de novo</span>
    </div>
    <div class="transcricao-ao-vivo oculto" id="transcricaoAoVivo">
      <span class="transcricao-ao-vivo__rotulo">Estou ouvindo:</span>
      <span id="textoAoVivo">…</span>
    </div>
    <button type="button" class="btn-digitar-toggle oculto" id="btnDigitarToggle">Prefere digitar? Toque aqui</button>
    <div class="painel-digitar oculto" id="painelDigitar">
      <label for="textoDigitado" class="instrucao" style="max-width:none;text-align:left;display:block;margin-bottom:0.5rem;">Escreva o lembrete com dia e hora</label>
      <textarea id="textoDigitado" placeholder="Ex.: Me lembra amanhã meio-dia de tomar o remédio"></textarea>
      <button type="button" class="btn-secundario" id="btnEnviarDigitado">Salvar lembrete</button>
    </div>
    <div id="painelLista" class="painel-lista oculto" aria-live="polite"></div>
    <div id="painelConfirmar" class="cartao-confirmacao oculto" aria-live="polite"></div>

    <div class="modo-teste" id="modoTeste">
      <p class="aviso-teste">Modo teste (sem microfone)</p>
      <label for="textoTeste">Digite o lembrete:</label>
      <textarea id="textoTeste" placeholder="Me lembrar de ligar pra ALFE no dia 15 do mes que vem"></textarea>
      <button type="button" class="btn-secundario" id="btnEnviarTeste">Enviar texto de teste</button>
    </div>

    <div class="area-mensagem area-mensagem--neutra" id="areaMensagem" aria-live="polite" aria-atomic="true"></div>

    <p class="cronometro oculto" id="cronometro" aria-hidden="true">0:00</p>

    <button type="button" class="btn-principal btn-principal--pronto" id="btnPrincipal" aria-label="Toque para gravar">
      <svg class="btn-icone-mic oculto" id="iconeMic" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
      <span class="spinner oculto" id="spinner"></span>
      <span id="textoBtn">Toque para gravar</span>
    </button>

    <div id="acoesSecundarias"></div>
  </main>

  <div class="toast oculto" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-overlay oculto" id="modalOverlay" aria-modal="true" role="dialog">
    <div class="modal-caixa">
      <p id="modalTexto"></p>
      <div class="modal-acoes" id="modalAcoes"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    /*
     * ARQUITETURA (padrão — tudo no navegador):
     *   Voz (Web Speech API) → interpretar data/tarefa (JS) → salvar (localStorage)
     *   → arquivo .ics → Calendário do celular manda o aviso.
     *
     * Config: config.js define window.APP_CONFIG (gerado no deploy ou copie config.example.js).
     */
    var CONFIG = Object.assign(
      {
        SENHA: 'COLOCAR_SENHA_AQUI',
        API_URL: '',
        TOKEN: '',
        DURACAO_MAXIMA_SEG: 60,
        DURACAO_MINIMA_SEG: 1
      },
      window.APP_CONFIG || {}
    );

    const CHAVE_SESSAO = 'lembretes_auth_v1';
    const CHAVE_LEMBRETES = 'meus_lembretes_v1';
    const FUSO = 'America/Sao_Paulo';
    const TITULO_EVENTO_OUTLOOK = 'Alerta - CRM';
    const OFFSET_OUTLOOK_WEB = '-03:00';
    /** Conta pessoal @outlook.com / @hotmail — compose via live.com (não office.com). */
    const OUTLOOK_WEB_COMPOSE = 'https://outlook.live.com/calendar/0/deeplink/compose';

    const MIME_PREFERENCIA = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/mp4',
      'audio/ogg;codecs=opus'
    ];

    const ESTADO = {
      PRONTO: 'PRONTO',
      GRAVANDO: 'GRAVANDO',
      ENVIANDO: 'ENVIANDO',
      SUCESSO: 'SUCESSO',
      ERRO_BACKEND: 'ERRO_BACKEND',
      ERRO_REDE: 'ERRO_REDE',
      MICROFONE_NEGADO: 'MICROFONE_NEGADO',
      SEM_SUPORTE: 'SEM_SUPORTE',
      LISTA: 'LISTA',
      CONFIRMAR: 'CONFIRMAR'
    };

    const INSTRUCAO_PADRAO =
      'Toque no botão azul, fale o lembrete com o dia, e toque de novo para parar.';

    const params = new URLSearchParams(window.location.search);
    const modoTeste = params.get('teste') === '1';

    let estadoAtual = ESTADO.PRONTO;
    let mediaStream = null;
    let mediaRecorder = null;
    let chunks = [];

    function hashSenha(texto) {
      if (!window.crypto || !crypto.subtle) {
        return Promise.resolve(String(texto));
      }
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(texto)))
        .then(function (buf) {
          return Array.from(new Uint8Array(buf))
            .map(function (b) { return b.toString(16).padStart(2, '0'); })
            .join('');
        });
    }

    function blobParaBase64(blob) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onloadend = function () {
          const result = reader.result;
          if (typeof result !== 'string') {
            reject(new Error('Leitura inválida'));
            return;
          }
          const idx = result.indexOf(',');
          resolve(idx >= 0 ? result.slice(idx + 1) : result);
        };
        reader.onerror = function () { reject(reader.error || new Error('Falha ao ler áudio')); };
        reader.readAsDataURL(blob);
      });
    }

    function cfg(nome, padrao) {
      if (CONFIG[nome] === undefined || CONFIG[nome] === null) return padrao;
      return CONFIG[nome];

    function reconhecimentoDisponivel() {

    function agoraNoFuso() {
      return new Date(new Date().toLocaleString('en-US', { timeZone: FUSO }));
    }

    function dataISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dia = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + dia;
    }

    function somarDias(d, n) {
      const x = new Date(d.getTime());
      x.setDate(x.getDate() + n);
      return x;
    }

    function proximoDiaSemana(d, diaDom0) {
      const x = new Date(d.getTime());
      let diff = diaDom0 - x.getDay();
      if (diff <= 0) diff += 7;
      return somarDias(x, diff);
    }

    const MAPA_DIAS = [
      ['domingo', 0], ['segunda', 1], ['terça', 2], ['terca', 2],
      ['quarta', 3], ['quinta', 4], ['sexta', 5], ['sábado', 6], ['sabado', 6]
    ];

    const DIAS_EXT = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
    const MESES_EXT = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

    const REGEX_MES = 'janeiro|jan|fevereiro|fev|marco|mar|abril|abr|maio|mai|junho|jun|julho|jul|agosto|ago|setembro|set|outubro|out|novembro|nov|dezembro|dez';

    function normalizarParaBusca(texto) {
      return String(texto)
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function numeroDoMes(nome) {
      const mapa = {
        janeiro: 1, jan: 1, fevereiro: 2, fev: 2, marco: 3, mar: 3, abril: 4, abr: 4,
        maio: 5, mai: 5, junho: 6, jun: 6, julho: 7, jul: 7, agosto: 8, ago: 8,
        setembro: 9, set: 9, outubro: 10, out: 10, novembro: 11, nov: 11, dezembro: 12, dez: 12
      };
      return mapa[nome] || null;
    }

    function inicioDoDia(d) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0);
    }

    function dataComDiaEMes(dia, mesNum, hoje) {
      let ano = hoje.getFullYear();
      let cand = new Date(ano, mesNum - 1, dia, 12, 0, 0);
      if (cand < inicioDoDia(hoje)) {
        ano += 1;
        cand = new Date(ano, mesNum - 1, dia, 12, 0, 0);
      }
      return dataISO(cand);
    }

    function pareceAmanha(t) {
      if (/\bdepois de amanha\b/.test(t)) return false;
      if (/\b(amanha|para amanha|pra amanha|amanha de manha|amanha de tarde)\b/.test(t)) return true;
      // STT às vezes transcreve "amanhã meio-dia" como "a manha meio dia"
      if (/\bmeio[\s-]?dia\b/.test(t) && /\b(a manha|na manha)\b/.test(t) && !/\bhoje\b/.test(t)) return true;
      return false;
    }

    function extrairDataDoTexto(texto) {
      const t = normalizarParaBusca(texto);
      const hoje = agoraNoFuso();

      // "12 de novembro", "dia 12 de novembro", "no dia 12 de outubro"
      const comMes = t.match(new RegExp('(?:no\\s+)?(?:dia\\s+)?(\\d{1,2})\\s+de\\s+(' + REGEX_MES + ')\\b'));
      if (comMes) {
        const dia = parseInt(comMes[1], 10);
        const mes = numeroDoMes(comMes[2]);
        if (mes && dia >= 1 && dia <= 31) return dataComDiaEMes(dia, mes, hoje);
      }

      if (/\bhoje\b/.test(t)) return dataISO(hoje);
      if (/\bdepois de amanha\b/.test(t)) return dataISO(somarDias(hoje, 2));
      if (pareceAmanha(t)) return dataISO(somarDias(hoje, 1));

      let i;
      for (i = 0; i < MAPA_DIAS.length; i++) {
        const nome = MAPA_DIAS[i][0].normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        if (new RegExp('\\b' + nome + '\\b').test(t)) {
          return dataISO(proximoDiaSemana(hoje, MAPA_DIAS[i][1]));
        }
      }

      // "dia 15" sem mês: próximo dia 15 no calendário
      const soDia = t.match(/\bdia\s+(\d{1,2})\b/);
      if (soDia) {
        const diaNum = parseInt(soDia[1], 10);
        if (diaNum >= 1 && diaNum <= 31) {
          let ano = hoje.getFullYear();
          let mes = hoje.getMonth();
          let cand = new Date(ano, mes, diaNum, 12, 0, 0);
          if (cand < inicioDoDia(hoje)) {
            mes += 1;
            if (mes > 11) { mes = 0; ano += 1; }
            cand = new Date(ano, mes, diaNum, 12, 0, 0);
          }
          return dataISO(cand);
        }
      }

      // "meio dia" / horário sem data → assume amanhã se parecer pedido de lembrete
      if (/\bmeio[\s-]?dia\b/.test(t) && /\b(lembra|lembrar|lembrete)\b/.test(t)) {
        return dataISO(somarDias(hoje, 1));
      }

      return null;
    }

    function extrairHoraDoTexto(texto) {
      const t = normalizarParaBusca(texto);

      if (/\bmeio[\s-]?dia\b/.test(t)) return '12:00';
      if (/\bmeia[\s-]?noite\b/.test(t)) return '00:00';

      const mMeia = t.match(/\b(\d{1,2})\s*(?:e|:|\s)\s*meia\b/);
      if (mMeia) {
        const hh = parseInt(mMeia[1], 10);
        if (hh >= 0 && hh <= 23) return String(hh).padStart(2, '0') + ':30';
      }

      const mHoras = t.match(/\b(?:as|a|para|pras|por volta(?: de)?)\s*(\d{1,2})\s*horas?\b/);
      if (mHoras) {
        const hh = parseInt(mHoras[1], 10);
        if (hh >= 0 && hh <= 23) return String(hh).padStart(2, '0') + ':00';
      }

      const mH = t.match(/\b(\d{1,2})\s*h\b/);
      if (mH) {
        const hh = parseInt(mH[1], 10);
        if (hh >= 0 && hh <= 23) return String(hh).padStart(2, '0') + ':00';
      }

      const m = t.match(/\b(?:as|a)\s*(\d{1,2})(?::(\d{2}))?\b/);
      if (m) {
        const hh = parseInt(m[1], 10);
        const mm = m[2] || '00';
        if (hh >= 0 && hh <= 23) return String(hh).padStart(2, '0') + ':' + mm;
      }

      const mNum = t.match(/\b(\d{1,2}):(\d{2})\b/);
      if (mNum) {
        const hh = parseInt(mNum[1], 10);
        if (hh >= 0 && hh <= 23) return String(hh).padStart(2, '0') + ':' + mNum[2];
      }

      return '';
    }

    function extrairTarefaDoTexto(texto) {
      let s = String(texto).trim();
      s = s.replace(/^(me\s+)?(lembra|lembrar)(me)?(\s+de)?\s*/i, '');
      s = s.replace(/^(para|pra)\s+/i, '');
      s = s.replace(/\s+(por favor\.?|t[aá]\.?|ok\.?)$/i, '');

      const t = normalizarParaBusca(s);
      s = s.replace(new RegExp('(?:no\\s+)?(?:dia\\s+)?\\d{1,2}\\s+de\\s+(' + REGEX_MES + ')', 'gi'), '');
      s = s.replace(/\b(hoje|amanhã|amanha|depois de amanhã|depois de amanha)\b/gi, '');
      s = s.replace(/\b(segunda|terça|terca|quarta|quinta|sexta|sábado|sabado|domingo)(?:-feira)?\b/gi, '');
      s = s.replace(/\b(?:as|a|para|pras)\s+\d{1,2}(?::\d{2})?\s*(?:horas?|h)?\b/gi, '');
      s = s.replace(/\bmeio[\s-]?dia\b/gi, '');
      s = s.replace(/\bmeia[\s-]?noite\b/gi, '');
      s = s.replace(/\bdia\s+\d{1,2}\b/gi, '');
      s = s.replace(/\s+/g, ' ').trim();
      return s || String(texto).trim();
    }

    function dataPorExtenso(iso) {
      const p = iso.split('-').map(Number);
      const dt = new Date(p[0], p[1] - 1, p[2], 12);
      return DIAS_EXT[dt.getDay()] + ', ' + p[2] + ' de ' + MESES_EXT[p[1] - 1];
    }

    function interpretarLocal(texto) {
      const bruto = String(texto || '').trim();
      if (!bruto) {
        return { ok: false, mensagem: 'Não ouvi nada. Fale mais perto do celular e tente de novo.' };
      }
      const data = extrairDataDoTexto(bruto);
      const tarefa = extrairTarefaDoTexto(bruto);
      const hora = extrairHoraDoTexto(bruto);
      if (!data) {
        return {
          ok: false,
          texto: bruto,
          mensagem: 'Entendi o lembrete, mas não entendi PARA QUANDO. Fale de novo com “amanhã”, “sexta” ou “dia 15”.'
        };
      }
      const item = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        tarefa: tarefa,
        data: data,
        hora: hora,
        texto: bruto,
        criadoEm: new Date().toISOString()
      };
      return { ok: true, texto: bruto, lembretes: [item], mensagem: montarMensagemOk([item]) };
    }

    function salvarLembretesLocal(lembretes) {
      let lista = [];
      try {
        lista = JSON.parse(localStorage.getItem(CHAVE_LEMBRETES) || '[]');
      } catch (_) {
        lista = [];
      }
      lembretes.forEach(function (l) { lista.push(l); });
      try {
        localStorage.setItem(CHAVE_LEMBRETES, JSON.stringify(lista));
      } catch (e) {
        console.error(e);
      }
    }

    function ehAndroid() {
      return /Android/i.test(navigator.userAgent);
    }

    function ehMobile() {
      return /Android|webOS|iPhone|iPad|iPod|IEMobile|Opera Mini|Mobi/i.test(navigator.userAgent);
    }

    function somarMinutosNaData(isoData, hm, minutos) {
      const p = isoData.split('-').map(Number);
      const d = new Date(p[0], p[1] - 1, p[2], parseInt(hm[0], 10), parseInt(hm[1], 10), 0);
      d.setMinutes(d.getMinutes() + minutos);
      const pad = function (n) { return String(n).padStart(2, '0'); };
      return pad(d.getFullYear()) + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
        'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':00';
    }

    function dadosEventoOutlook(l) {
      const p = l.data.split('-');
      const hora = l.hora || '09:00';
      const hm = hora.split(':');
      const inicio = p[0] + '-' + p[1] + '-' + p[2] + 'T' + hm[0] + ':' + hm[1] + ':00';
      const transcricao = String(l.texto || '').trim();
      return {
        titulo: TITULO_EVENTO_OUTLOOK,
        descricao: transcricao || String(l.tarefa || '').trim(),
        inicio: inicio,
        fim: somarMinutosNaData(l.data, hm, 15)
      };
    }

    function dataHoraOutlookWeb(isoLocal) {
      return isoLocal.slice(0, 19) + OFFSET_OUTLOOK_WEB;
    }

    function instanteDoLembrete(l) {
      const p = l.data.split('-').map(Number);
      const hm = (l.hora || '09:00').split(':');
      return new Date(p[0], p[1] - 1, p[2], parseInt(hm[0], 10), parseInt(hm[1], 10), 0);
    }

    function lembreteEhFuturo(l) {
      if (!l || !l.data) return false;
      return instanteDoLembrete(l).getTime() > agoraNoFuso().getTime();
    }

    function queryOutlookMobile(ev) {
      // Mobile: "description" preenche o campo (body é só na Web). start/end e startdt/enddt por compatibilidade.
      return 'title=' + encodeURIComponent(ev.titulo) +
        '&description=' + encodeURIComponent(ev.descricao) +
        '&start=' + encodeURIComponent(ev.inicio) +
        '&end=' + encodeURIComponent(ev.fim) +
        '&startdt=' + encodeURIComponent(ev.inicio) +
        '&enddt=' + encodeURIComponent(ev.fim);
    }

    /** Deep link do app Outlook (mobile). Se não houver app, a página permanece aqui. */
    function urlOutlookApp(l) {
      const ev = dadosEventoOutlook(l);
      return 'ms-outlook://events/new?' + queryOutlookMobile(ev);
    }

    function urlOutlookAndroidIntent(l) {
      const ev = dadosEventoOutlook(l);
      return 'intent://events/new?' + queryOutlookMobile(ev) +
        '#Intent;scheme=ms-outlook;package=com.microsoft.office.outlook;end';
    }

    /** Desktop: Outlook na Web — contas pessoais (outlook.live.com). */
    function urlOutlookWeb(l) {
      const ev = dadosEventoOutlook(l);
      const params = [
        'path=' + encodeURIComponent('/calendar/action/compose'),
        'rru=addevent',
        'startdt=' + encodeURIComponent(dataHoraOutlookWeb(ev.inicio)),
        'enddt=' + encodeURIComponent(dataHoraOutlookWeb(ev.fim)),
        'subject=' + encodeURIComponent(ev.titulo),
        'body=' + encodeURIComponent(ev.descricao),
        'timezone=' + encodeURIComponent(FUSO)
      ];
      return OUTLOOK_WEB_COMPOSE + '?' + params.join('&');
    }

    function abrirOutlookDesktop(l) {
      const url = urlOutlookWeb(l);
      const novaAba = window.open(url, '_blank', 'noopener,noreferrer');
      if (!novaAba) {
        avisoOutlookPopUpBloqueado();
      }
    }

    function avisoOutlookPopUpBloqueado() {
      if (estadoAtual !== ESTADO.SUCESSO) return;
      if (document.getElementById('avisoOutlook')) return;
      const p = document.createElement('p');
      p.id = 'avisoOutlook';
      p.className = 'mensagem-ouvi';
      p.textContent = 'Não saí desta página. Se o Outlook não abriu, permita pop-ups para este site e toque de novo em “Abrir Outlook de novo”.';
      el.areaMensagem.appendChild(p);
    }

    function avisoOutlookNaoAbriu() {
      if (estadoAtual !== ESTADO.SUCESSO) return;
      if (document.getElementById('avisoOutlook')) return;
      const p = document.createElement('p');
      p.id = 'avisoOutlook';
      p.className = 'mensagem-ouvi';
      p.textContent = 'O Outlook não abriu neste aparelho. O lembrete ficou salvo — veja em “Ver próximos lembretes”.';
      el.areaMensagem.appendChild(p);
    }

    function tentarAbrirOutlookEvento(lembretes) {
      if (!lembretes || !lembretes.length) return;
      const l = lembretes[0];
      if (!ehMobile()) {
        abrirOutlookDesktop(l);
        return;
      }
      tentarAbrirOutlookMobile(lembretes);
    }

    function tentarAbrirOutlookMobile(lembretes) {
      if (!lembretes || !lembretes.length) return;

      const l = lembretes[0];
      const url = ehAndroid() ? urlOutlookAndroidIntent(l) : urlOutlookApp(l);
      let appAbriu = false;

      function marcarAbriu() {
        if (document.hidden) appAbriu = true;
      }

      function marcarAbriuPagina() {
        appAbriu = true;
      }

      document.addEventListener('visibilitychange', marcarAbriu);
      window.addEventListener('pagehide', marcarAbriuPagina);
      window.addEventListener('blur', marcarAbriuPagina);

      const link = document.createElement('a');
      link.href = url;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      link.remove();

      window.setTimeout(function () {
        document.removeEventListener('visibilitychange', marcarAbriu);
        window.removeEventListener('pagehide', marcarAbriuPagina);
        window.removeEventListener('blur', marcarAbriuPagina);
        if (!appAbriu && !document.hidden) {
          avisoOutlookNaoAbriu();
        }
      }, 2200);
    }

    function carregarTodosLembretes() {
      try {
        return JSON.parse(localStorage.getItem(CHAVE_LEMBRETES) || '[]');
      } catch (_) {
        return [];
      }
    }

    function listarProximosLembretes() {
      return carregarTodosLembretes()
        .filter(lembreteEhFuturo)
        .sort(function (a, b) {
          const ta = instanteDoLembrete(a).getTime();
          const tb = instanteDoLembrete(b).getTime();
          return ta - tb;
        });
    }

    function excluirLembrete(id) {
      mostrarModalConfirmacao('Quer mesmo apagar este lembrete? Não dá para desfazer.', function () {
        const lista = carregarTodosLembretes().filter(function (l) { return l.id !== id; });
        try {
          localStorage.setItem(CHAVE_LEMBRETES, JSON.stringify(lista));
        } catch (e) {
          console.error(e);
        }
        mostrarToast('Lembrete apagado.', 'ok');
        renderizarListaLembretes();
      });
    }

    function renderizarListaLembretes() {
      const itens = listarProximosLembretes();
      let html = '<h2>Próximos lembretes</h2>';
      if (!itens.length) {
        html += '<p class="lista-vazia">Nenhum lembrete futuro. Toque em Voltar e grave um novo.</p>';
      } else {
        itens.forEach(function (l) {
          html += '<article class="item-lembrete">';
          html += '<p class="item-lembrete__data">' + escapeHtml(dataPorExtenso(l.data)) +
            (l.hora ? ' · ' + escapeHtml(l.hora) : ' · 9h (padrão)') + '</p>';
          html += '<p class="item-lembrete__tarefa">' + escapeHtml(l.tarefa) + '</p>';
          html += '<button type="button" class="btn-excluir" data-id="' + escapeHtml(l.id) + '">Excluir este lembrete</button>';
          html += '</article>';
        });
      }
      html += '<button type="button" class="btn-secundario" id="btnVoltarLista" style="width:100%;margin-top:0.5rem;">Voltar</button>';
      el.painelLista.innerHTML = html;
      el.painelLista.querySelectorAll('.btn-excluir').forEach(function (btn) {
        btn.addEventListener('click', function () {
          excluirLembrete(btn.getAttribute('data-id'));
        });
      });
      const voltar = document.getElementById('btnVoltarLista');
      if (voltar) {
        voltar.addEventListener('click', function () {
          renderizarEstado(ESTADO.PRONTO, {});
        });
      }
    }

    function processarTextoLocalConfirmado(r) {
      if (envioEmAndamento) return;
      envioEmAndamento = true;
      renderizarEstado(ESTADO.ENVIANDO, {});
      window.setTimeout(function () {
        try {
          envioEmAndamento = false;
          salvarLembretesLocal(r.lembretes);
          textoPendenteConfirmacao = '';
          resultadoPendenteConfirmacao = null;
          mostrarToast('Lembrete guardado!', 'ok');
          renderizarEstado(ESTADO.SUCESSO, {
            mensagem: r.mensagem,
            texto: r.texto,
            lembretes: r.lembretes
          });
          if (ehMobile()) {
            window.setTimeout(function () {
              tentarAbrirOutlookEvento(r.lembretes);
            }, 900);
          }
        } catch (err) {
          console.error(err);
          envioEmAndamento = false;
          renderizarEstado(ESTADO.ERRO_BACKEND, {
            mensagem: 'Não consegui guardar. Tente de novo.',
            permitirDigitar: true,
            texto: r.texto || ''
          });
        }
      }, 400);
    }

    function processarEntrada(texto) {
      if (apiAtiva()) {
        return enviar({ token: cfg('TOKEN', ''), texto: texto });
      }
      prepararConfirmacao(texto);
    }

    function finalizarGravacaoLocal() {
      limparTimersGravacao();
      modoGravacaoLocal = false;
      paradaReconhecimento = false;
      const duracaoSeg = (Date.now() - inicioGravacaoMs) / 1000;
      const texto = transcriptaoAtual.trim();
      transcriptaoAtual = '';
      reconhecimento = null;

      if (duracaoSeg < cfg('DURACAO_MINIMA_SEG', 1)) {
        renderizarEstado(ESTADO.PRONTO, { avisoCurto: true });
        return;
      }
      if (!texto) {
        renderizarEstado(ESTADO.PRONTO, {
          aviso: 'Não ouvi nada. Fale devagar, perto do celular, e toque de novo para terminar.'
        });
        return;
      }
      prepararConfirmacao(texto);
    }

    async function enviar(payload) {
      if (!apiAtiva()) {
        if (payload.texto) prepararConfirmacao(payload.texto);
        return;
      }
      if (envioEmAndamento) return;
      envioEmAndamento = true;
      ultimoPayload = payload;
      renderizarEstado(ESTADO.ENVIANDO, {});

      const controller = new AbortController();
      const timeoutId = setTimeout(function () { controller.abort(); }, 60000);

      try {
        // Corpo como Blob text/plain sem charset evita preflight OPTIONS (GAS não responde OPTIONS).
        const corpo = new Blob([JSON.stringify(payload)], { type: 'text/plain' });
        const res = await fetch(CONFIG.API_URL, {
          method: 'POST',
          body: corpo,
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        let data;
        try {
          data = await res.json();
        } catch (parseErr) {
          console.error(parseErr);
          renderizarEstado(ESTADO.ERRO_REDE, {});
          return;
        }

        if (data.ok) {
          renderizarEstado(ESTADO.SUCESSO, {
            mensagem: data.mensagem || 'Pronto!',
            texto: data.texto || ''
          });
        } else {
          console.error(data.erro);
          renderizarEstado(ESTADO.ERRO_BACKEND, {
            mensagem: data.mensagem || 'Não deu para anotar desta vez. Tente falar de novo.'
          });
        }
      } catch (err) {
        clearTimeout(timeoutId);
        console.error(err);
        renderizarEstado(ESTADO.ERRO_REDE, {});
      } finally {
        envioEmAndamento = false;
      }
    }

    function enviarBlob(blob, mime) {
      return blobParaBase64(blob).then(function (base64) {
        return enviar({
          token: CONFIG.TOKEN,
          audio: base64,
          mimeType: mime || blob.type || mimeTypeGravacao
        });
      });
    }

    function iniciarGravacao() {
      const mimeEscolhido = escolherMimeType();
      const opcoes = mimeEscolhido ? { mimeType: mimeEscolhido } : undefined;

      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function (stream) {
          mediaStream = stream;
          chunks = [];
          try {
            mediaRecorder = opcoes
              ? new MediaRecorder(stream, opcoes)
              : new MediaRecorder(stream);
          } catch (e) {
            console.error(e);
            pararStream();
            renderizarEstado(ESTADO.SEM_SUPORTE, {});
            return;
          }

          mimeTypeGravacao = mediaRecorder.mimeType || mimeEscolhido || 'audio/webm';

          mediaRecorder.ondataavailable = function (ev) {
            if (ev.data && ev.data.size > 0) chunks.push(ev.data);
          };

          mediaRecorder.onstop = function () {
            limparTimersGravacao();
            const duracaoSeg = (Date.now() - inicioGravacaoMs) / 1000;
            pararStream();

            if (duracaoSeg < cfg('DURACAO_MINIMA_SEG', 1)) {
              renderizarEstado(ESTADO.PRONTO, { avisoCurto: true });
              return;
            }

            const blob = new Blob(chunks, { type: mimeTypeGravacao });
            chunks = [];
            enviarBlob(blob, mimeTypeGravacao).catch(function (err) {
              console.error(err);
              renderizarEstado(ESTADO.ERRO_REDE, {});
            });
          };

          mediaRecorder.onerror = function (ev) {
            console.error(ev.error || ev);
            limparTimersGravacao();
            pararStream();
            renderizarEstado(ESTADO.PRONTO, {
              aviso: 'Algo deu errado na gravação. Toque para tentar de novo.'
            });
          };

          inicioGravacaoMs = Date.now();
          mediaRecorder.start(250);

          if (navigator.vibrate) {
            try { navigator.vibrate(80); } catch (_) { /* ignore */ }
          }

          renderizarEstado(ESTADO.GRAVANDO, {});

          timerInterval = setInterval(function () {
            const seg = (Date.now() - inicioGravacaoMs) / 1000;
            el.cronometro.textContent = formatarTempo(seg);
          }, 200);

          timerMaximo = setTimeout(function () {
            pararGravacao();
          }, cfg('DURACAO_MAXIMA_SEG', 60) * 1000);
        })
        .catch(function (err) {
          console.error(err);
          pararStream();
          if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            renderizarEstado(ESTADO.MICROFONE_NEGADO, {});
          } else {
            renderizarEstado(ESTADO.PRONTO, {
              aviso: 'Não consegui usar o microfone. Toque para tentar de novo.'
            });
          }
        });
    }

    function iniciarGravacaoLocal() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        renderizarEstado(ESTADO.SEM_SUPORTE, {});
        return;
      }

      transcriptaoAtual = '';
      paradaReconhecimento = false;
      tentativasReconhecimento = 0;
      modoGravacaoLocal = true;
      mediaRecorder = null;
      atualizarTranscricaoAoVivo('');

      reconhecimento = new SpeechRecognition();
      reconhecimento.lang = 'pt-BR';
      reconhecimento.continuous = true;
      reconhecimento.interimResults = true;

      reconhecimento.onresult = function (ev) {
        let t = '';
        for (let i = 0; i < ev.results.length; i++) {
          t += ev.results[i][0].transcript;
        }
        transcriptaoAtual = t;
        atualizarTranscricaoAoVivo(t);
        atualizarPassoGravacao(2);
      };

      reconhecimento.onerror = function (ev) {
        const cod = ev.error || '';
        console.error(cod || ev);
        if (cod === 'no-speech') {
          atualizarTranscricaoAoVivo('Fale agora, devagar e perto do aparelho…');
          return;
        }
        if ((cod === 'network' || cod === 'aborted') && modoGravacaoLocal && tentativasReconhecimento < 3) {
          tentativasReconhecimento++;
          mostrarToast('Conexão oscilou. Continuando a ouvir…', 'alerta');
          window.setTimeout(function () {
            if (modoGravacaoLocal && reconhecimento) {
              try { reconhecimento.start(); } catch (err) { console.error(err); }
            }
          }, 400);
          return;
        }
        if (cod === 'not-allowed' || cod === 'service-not-allowed') {
          paradaReconhecimento = true;
          modoGravacaoLocal = false;
          reconhecimento = null;
          limparTimersGravacao();
          renderizarEstado(ESTADO.MICROFONE_NEGADO, {});
        }
      };

      reconhecimento.onend = function () {
        if (paradaReconhecimento) {
          if (modoGravacaoLocal) finalizarGravacaoLocal();
          return;
        }
        if (modoGravacaoLocal && reconhecimento) {
          try { reconhecimento.start(); } catch (err) {
            console.error(err);
            paradaReconhecimento = true;
            finalizarGravacaoLocal();
          }
        }
      };

      inicioGravacaoMs = Date.now();
      try {
        reconhecimento.start();
      } catch (err) {
        console.error(err);
        modoGravacaoLocal = false;
        reconhecimento = null;
        renderizarEstado(ESTADO.PRONTO, {
          aviso: 'Não consegui iniciar o microfone. Toque para tentar de novo.'
        });
        return;
      }

      if (navigator.vibrate) {
        try { navigator.vibrate(80); } catch (_) { /* ignore */ }
      }

      atualizarPassoGravacao(1);
      renderizarEstado(ESTADO.GRAVANDO, {});

      timerInterval = setInterval(function () {
        const seg = (Date.now() - inicioGravacaoMs) / 1000;
        el.cronometro.textContent = formatarTempo(seg);
      }, 200);

      timerMaximo = setTimeout(function () {
        paradaReconhecimento = true;
        if (reconhecimento) {
          try { reconhecimento.stop(); } catch (_) { /* ignore */ }
        }
      }, cfg('DURACAO_MAXIMA_SEG', 60) * 1000);
    }

    function pararGravacao() {
      if (modoGravacaoLocal && reconhecimento) {
        atualizarPassoGravacao(3);
        paradaReconhecimento = true;
        try {
          reconhecimento.stop();
        } catch (e) {
          console.error(e);
          finalizarGravacaoLocal();
        }
        return;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try {
          mediaRecorder.stop();
        } catch (e) {
          console.error(e);
          limparTimersGravacao();
          pararStream();
          renderizarEstado(ESTADO.PRONTO, {});
        }
      }
    }

    function renderizarEstado(estado, dados) {
      estadoAtual = estado;
      dados = dados || {};
      limparTimerEnviando();
      el.acoesSecundarias.innerHTML = '';

      el.areaMensagem.className = 'area-mensagem area-mensagem--neutra';
      el.areaMensagem.innerHTML = '';
      el.instrucao.classList.remove('oculto');
      el.cronometro.classList.add('oculto');
      el.btnPrincipal.disabled = false;
      el.btnPrincipal.className = 'btn-principal';
      el.iconeMic.classList.add('oculto');
      el.spinner.classList.add('oculto');
      el.painelLista.classList.add('oculto');
      el.btnVerLembretes.classList.add('oculto');
      el.painelConfirmar.classList.add('oculto');
      el.painelConfirmar.innerHTML = '';
      el.passosGravacao.classList.add('oculto');
      el.passosGravacao.setAttribute('aria-hidden', 'true');
      el.transcricaoAoVivo.classList.add('oculto');
      if (!dados.manterPainelDigitar) {
        el.painelDigitar.classList.add('oculto');
      }
      if (!dados.manterPainelDigitar && estado !== ESTADO.PRONTO) {
        el.btnDigitarToggle.classList.add('oculto');
      }

      switch (estado) {
        case ESTADO.PRONTO:
          el.instrucao.textContent = INSTRUCAO_PADRAO;
          el.instrucao.classList.remove('oculto');
          el.btnVerLembretes.classList.remove('oculto');
          if (!modoTeste) {
            el.btnDigitarToggle.classList.remove('oculto');
          }
          if (dados.manterPainelDigitar) {
            el.painelDigitar.classList.remove('oculto');
          }
          if (dados.avisoCurto) {
            el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
            el.areaMensagem.innerHTML =
              '<p class="mensagem-principal">Foi rapidinho demais. Toque no botão, fale o lembrete e toque de novo para terminar.</p>';
          } else if (dados.aviso) {
            el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
            el.areaMensagem.innerHTML =
              '<p class="mensagem-principal">' + escapeHtml(dados.aviso) + '</p>';
          }
          el.btnPrincipal.classList.add('btn-principal--pronto');
          el.iconeMic.classList.remove('oculto');
          el.textoBtn.textContent = 'Toque para gravar';
          el.btnPrincipal.setAttribute('aria-label', 'Toque para gravar');
          break;

        case ESTADO.GRAVANDO:
          el.instrucao.classList.add('oculto');
          el.passosGravacao.classList.remove('oculto');
          el.passosGravacao.setAttribute('aria-hidden', 'false');
          el.transcricaoAoVivo.classList.remove('oculto');
          el.btnDigitarToggle.classList.add('oculto');
          el.painelDigitar.classList.add('oculto');
          el.cronometro.classList.remove('oculto');
          el.cronometro.textContent = '0:00';
          el.btnPrincipal.classList.add('btn-principal--gravando');
          el.iconeMic.classList.remove('oculto');
          el.textoBtn.textContent = 'Toque para terminar';
          el.btnPrincipal.setAttribute('aria-label', 'Toque para terminar a gravação');
          break;

        case ESTADO.ENVIANDO:
          el.instrucao.classList.add('oculto');
          el.btnPrincipal.disabled = true;
          el.btnPrincipal.classList.add('btn-principal--enviando');
          el.spinner.classList.remove('oculto');
          el.textoBtn.textContent = apiAtiva() ? 'Anotando seu lembrete…' : 'Entendendo o que você falou…';
          el.btnPrincipal.setAttribute('aria-label', 'Processando lembrete');
          timerMensagemEnviando = setTimeout(function () {
            if (estadoAtual === ESTADO.ENVIANDO) {
              el.textoBtn.textContent = 'Só mais um pouquinho…';
            }
          }, 10000);
          break;

        case ESTADO.SUCESSO: {
          el.instrucao.classList.add('oculto');
          el.btnPrincipal.classList.add('oculto');
          el.areaMensagem.className = 'area-mensagem area-mensagem--sucesso';
          const msg = dados.mensagem || '';
          const ouvi = dados.texto || '';
          let html = '<div class="icone-sucesso" aria-hidden="true">✅</div>';
          html += '<p class="mensagem-principal">' + escapeHtml(msg) + '</p>';
          if (ouvi) {
            html += '<p class="mensagem-ouvi">Eu ouvi: “' + escapeHtml(ouvi) + '”</p>';
          }
          el.areaMensagem.innerHTML = html;

          const btnOutro = document.createElement('button');
          btnOutro.type = 'button';
          btnOutro.className = 'btn-secundario';
          btnOutro.textContent = 'Gravar outro lembrete';
          btnOutro.addEventListener('click', function () {
            renderizarEstado(ESTADO.PRONTO, {});
            el.btnPrincipal.classList.remove('oculto');
          });

          el.acoesSecundarias.appendChild(btnOutro);

          if (dados.lembretes && dados.lembretes.length) {
            const btnCal = document.createElement('button');
            btnCal.type = 'button';
            btnCal.className = 'btn-secundario';
            btnCal.textContent = 'Abrir Outlook';
            btnCal.addEventListener('click', function () {
              tentarAbrirOutlookEvento(dados.lembretes);
            });
            el.acoesSecundarias.appendChild(btnCal);
          }
          break;
        }

        case ESTADO.CONFIRMAR: {
          const r = dados.resultado;
          if (!r || !r.ok || !r.lembretes.length) {
            renderizarEstado(ESTADO.PRONTO, {});
            break;
          }
          const l = r.lembretes[0];
          el.instrucao.classList.add('oculto');
          el.btnPrincipal.classList.add('oculto');
          el.areaMensagem.innerHTML = '';
          el.painelConfirmar.classList.remove('oculto');
          const horaTxt = l.hora ? l.hora : '9h (se não falou horário)';
          el.painelConfirmar.innerHTML =
            '<h2 class="cartao-confirmacao__titulo">Está certo?</h2>' +
            '<dl>' +
            '<dt>O que fazer</dt><dd>' + escapeHtml(l.tarefa) + '</dd>' +
            '<dt>Quando</dt><dd>' + escapeHtml(dataPorExtenso(l.data)) + ' · ' + escapeHtml(horaTxt) + '</dd>' +
            '<dt>Você disse</dt><dd>“' + escapeHtml(l.texto) + '”</dd>' +
            '</dl>' +
            '<button type="button" class="btn-secundario" id="btnConfirmarSim" style="width:100%;margin-top:1rem;font-size:1.15rem;padding:1rem;">Sim, está certo</button>' +
            '<button type="button" class="btn-secundario" id="btnConfirmarNao" style="width:100%;margin-top:0.5rem;">Não — gravar ou digitar de novo</button>';
          document.getElementById('btnConfirmarSim').addEventListener('click', confirmarESalvarLembrete);
          document.getElementById('btnConfirmarNao').addEventListener('click', function () {
            el.textoDigitado.value = textoPendenteConfirmacao || l.texto || '';
            renderizarEstado(ESTADO.PRONTO, { manterPainelDigitar: true });
            el.painelDigitar.classList.remove('oculto');
            el.textoDigitado.focus();
          });
          break;
        }

        case ESTADO.LISTA:
          el.instrucao.classList.add('oculto');
          el.btnPrincipal.classList.add('oculto');
          el.areaMensagem.innerHTML = '';
          el.painelLista.classList.remove('oculto');
          renderizarListaLembretes();
          break;

        case ESTADO.ERRO_BACKEND:
          el.instrucao.classList.add('oculto');
          el.btnPrincipal.classList.add('oculto');
          el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
          el.areaMensagem.innerHTML =
            '<p class="mensagem-principal">' + escapeHtml(dados.mensagem || 'Não deu desta vez.') + '</p>';
          if (dados.texto) {
            el.areaMensagem.innerHTML +=
              '<p class="mensagem-ouvi">Texto: “' + escapeHtml(dados.texto) + '”</p>';
          }
          adicionarBotaoSecundario('Tentar de novo', function () {
            renderizarEstado(ESTADO.PRONTO, {});
            el.btnPrincipal.classList.remove('oculto');
          });
          if (dados.permitirDigitar) {
            adicionarBotaoSecundario('Corrigir digitando', function () {
              el.textoDigitado.value = dados.texto || textoPendenteConfirmacao || '';
              renderizarEstado(ESTADO.PRONTO, { manterPainelDigitar: true });
              el.painelDigitar.classList.remove('oculto');
              el.btnPrincipal.classList.remove('oculto');
              el.textoDigitado.focus();
            });
          }
          break;

        case ESTADO.ERRO_REDE:
          el.instrucao.classList.add('oculto');
          el.btnPrincipal.classList.add('oculto');
          el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
          el.areaMensagem.innerHTML =
            '<p class="mensagem-principal">Não consegui enviar. Verifique se a internet está ligada.</p>';
          adicionarBotaoSecundario('Enviar de novo', function () {
            if (ultimoPayload) {
              enviar(ultimoPayload);
            } else {
              renderizarEstado(ESTADO.PRONTO, {});
              el.btnPrincipal.classList.remove('oculto');
            }
          });
          break;

        case ESTADO.MICROFONE_NEGADO:
          el.instrucao.classList.add('oculto');
          el.btnPrincipal.classList.add('oculto');
          el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
          el.areaMensagem.innerHTML = '<p class="mensagem-principal">Preciso do microfone para ouvir seu lembrete.</p>' +
            textoPassosMicrofone();
          adicionarBotaoSecundario('Tentar de novo', function () {
            renderizarEstado(ESTADO.PRONTO, {});
            el.btnPrincipal.classList.remove('oculto');
          });
          adicionarBotaoSecundario('Digitar em vez de falar', function () {
            renderizarEstado(ESTADO.PRONTO, { manterPainelDigitar: true });
            el.painelDigitar.classList.remove('oculto');
            el.textoDigitado.focus();
          });
          break;

        case ESTADO.SEM_SUPORTE:
          el.instrucao.textContent = 'Use o campo abaixo para escrever seu lembrete.';
          el.instrucao.classList.remove('oculto');
          el.btnDigitarToggle.classList.add('oculto');
          el.painelDigitar.classList.remove('oculto');
          el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
          el.areaMensagem.innerHTML =
            '<p class="mensagem-principal">Aqui não dá para usar a voz. Digite o lembrete com dia e hora.</p>';
          if (reconhecimentoDisponivel()) {
            el.btnPrincipal.classList.remove('oculto');
            adicionarBotaoSecundario('Tentar gravar de novo', function () {
              renderizarEstado(ESTADO.PRONTO, {});
            });
          } else {
            el.btnPrincipal.classList.add('oculto');
          }
          break;

        default:
          renderizarEstado(ESTADO.PRONTO, {});
      }
    }

    function adicionarBotaoSecundario(texto, aoClicar) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-secundario';
      btn.textContent = texto;
      btn.addEventListener('click', aoClicar);
      el.acoesSecundarias.appendChild(btn);
    }

    function textoPassosMicrofone() {
      if (ehSafari() || ehIOS()) {
        return (
          '<div class="passos-mic"><p>No iPhone:</p><ol>' +
          '<li>Toque o ícone <strong>AA</strong> ou o cadeado na barra de endereço.</li>' +
          '<li>Escolha <strong>Configurações do site</strong> ou <strong>Microfone</strong>.</li>' +
          '<li>Permita o microfone para este site.</li>' +
          '<li>Toque em <strong>Tentar de novo</strong> abaixo.</li></ol></div>'
        );
      }
      return (
        '<div class="passos-mic"><p>No Android:</p><ol>' +
        '<li>Toque o cadeado ao lado do endereço do site.</li>' +
        '<li>Toque em <strong>Permissões</strong>.</li>' +
        '<li>Ative o <strong>Microfone</strong>.</li>' +
        '<li>Toque em <strong>Tentar de novo</strong> abaixo.</li></ol></div>'
      );
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function aoClicarPrincipal() {
      if (modoTeste) return;
      if (estadoAtual === ESTADO.ENVIANDO) return;

      if (estadoAtual === ESTADO.PRONTO) {
        if (!apiAtiva()) {
          if (!reconhecimentoDisponivel()) {
            renderizarEstado(ESTADO.SEM_SUPORTE, {});
            el.textoDigitado.focus();
            return;
          }
          iniciarGravacaoLocal();
          return;
        }
        if (!navegadorSuportaGravacao()) {
          renderizarEstado(ESTADO.SEM_SUPORTE, {});
          return;
        }
        iniciarGravacao();
      } else if (estadoAtual === ESTADO.GRAVANDO) {
        pararGravacao();
      }
    }

    function iniciarApp() {
      if (appIniciado) return;
      appIniciado = true;
      verificarAmbiente();
      el.btnPrincipal.addEventListener('click', aoClicarPrincipal);
      el.btnVerLembretes.addEventListener('click', function () {
        if (estadoAtual === ESTADO.ENVIANDO || estadoAtual === ESTADO.GRAVANDO) return;
        renderizarEstado(ESTADO.LISTA, {});
      });
      el.btnDigitarToggle.addEventListener('click', function () {
        const aberto = !el.painelDigitar.classList.contains('oculto');
        if (aberto) {
          el.painelDigitar.classList.add('oculto');
          el.btnDigitarToggle.textContent = 'Prefere digitar? Toque aqui';
        } else {
          el.painelDigitar.classList.remove('oculto');
          el.btnDigitarToggle.textContent = 'Fechar digitação';
          el.textoDigitado.focus();
        }
      });
      el.btnEnviarDigitado.addEventListener('click', function () {
        if (estadoAtual === ESTADO.ENVIANDO || estadoAtual === ESTADO.GRAVANDO) return;
        const texto = (el.textoDigitado.value || '').trim();
        if (!texto) {
          mostrarToast('Escreva o lembrete com o dia.', 'alerta');
          el.textoDigitado.focus();
          return;
        }
        processarEntrada(texto);
      });

      if (modoTeste) {
        el.modoTeste.classList.add('ativo');
        el.btnPrincipal.classList.add('oculto');
        el.instrucao.textContent = 'Modo teste: digite um lembrete e envie sem gravar.';
        el.btnEnviarTeste.addEventListener('click', function () {
          if (estadoAtual === ESTADO.ENVIANDO) return;
          const texto = (el.textoTeste.value || '').trim();
          if (!texto) {
            el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
            el.areaMensagem.innerHTML =
              '<p class="mensagem-principal">Digite uma frase de lembrete no campo acima.</p>';
            return;
          }
          prepararConfirmacao(texto);
        });
      } else if (!apiAtiva() && !reconhecimentoDisponivel()) {
        renderizarEstado(ESTADO.SEM_SUPORTE, {});
      } else if (apiAtiva() && !navegadorSuportaGravacao()) {
        renderizarEstado(ESTADO.SEM_SUPORTE, {});
      } else {
        renderizarEstado(ESTADO.PRONTO, {});
      }
    }

    configurarPortaSenha();
    sessaoValida().then(function (ok) {
      if (ok) {
        mostrarApp();
        iniciarApp();
      }
    });
  </script>
</body>
</html>
