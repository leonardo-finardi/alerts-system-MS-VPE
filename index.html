<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1565C0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lembretes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Meus Lembretes</title>
  <style>
    :root {
      --cor-fundo: #F5F7FA;
      --cor-texto: #1A1A1A;
      --cor-azul: #1565C0;
      --cor-azul-escuro: #0D47A1;
      --cor-vermelho: #C62828;
      --cor-verde-fundo: #E8F5E9;
      --cor-verde-texto: #1B5E20;
      --cor-alerta-fundo: #FFF3E0;
      --cor-alerta-texto: #E65100;
      --fonte-base: clamp(22px, 5vw, 26px);
      --fonte-grande: clamp(28px, 6.5vw, 34px);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      height: 100%;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: var(--fonte-base);
      line-height: 1.45;
      color: var(--cor-texto);
      background: var(--cor-fundo);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding:
        calc(16px + var(--safe-top))
        calc(16px + var(--safe-right))
        calc(16px + var(--safe-bottom))
        calc(16px + var(--safe-left));
    }

    .app {
      width: 100%;
      max-width: 600px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      text-align: center;
    }

    .instrucao {
      font-size: var(--fonte-grande);
      font-weight: 600;
      margin: 0;
      max-width: 28ch;
    }

    .area-mensagem {
      width: 100%;
      padding: 1rem 1.25rem;
      border-radius: 16px;
      min-height: 3rem;
    }

    .area-mensagem--neutra { background: transparent; }
    .area-mensagem--sucesso {
      background: var(--cor-verde-fundo);
      color: var(--cor-verde-texto);
    }
    .area-mensagem--alerta {
      background: var(--cor-alerta-fundo);
      color: var(--cor-alerta-texto);
    }

    .mensagem-principal {
      font-size: var(--fonte-grande);
      font-weight: 600;
      margin: 0 0 0.5rem;
    }

    .mensagem-ouvi {
      font-size: var(--fonte-base);
      font-weight: 400;
      margin: 0;
      opacity: 0.9;
    }

    .icone-sucesso {
      font-size: clamp(48px, 12vw, 64px);
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .cronometro {
      font-size: clamp(40px, 10vw, 56px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin: 0;
      letter-spacing: 0.02em;
    }

    .btn-principal {
      width: min(72vw, 280px);
      height: min(72vw, 280px);
      min-width: 220px;
      min-height: 220px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #fff;
      font-size: clamp(20px, 4.5vw, 24px);
      font-weight: 600;
      font-family: inherit;
      transition: transform 0.15s ease, background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-principal:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-principal--pronto {
      background: var(--cor-azul);
      box-shadow: 0 8px 24px rgba(21, 101, 192, 0.35);
    }

    .btn-principal--pronto:focus-visible {
      outline: 4px solid #90CAF9;
      outline-offset: 4px;
    }

    .btn-principal--gravando {
      background: var(--cor-vermelho);
      box-shadow: 0 8px 24px rgba(198, 40, 40, 0.35);
    }

    @media (prefers-reduced-motion: no-preference) {
      .btn-principal--gravando {
        animation: pulsar 1.6s ease-in-out infinite;
      }
    }

    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .btn-principal--enviando {
      background: #78909C;
      cursor: not-allowed;
      opacity: 0.95;
    }

    .btn-principal:disabled {
      cursor: not-allowed;
    }

    .btn-icone-mic {
      width: clamp(56px, 14vw, 72px);
      height: clamp(56px, 14vw, 72px);
      fill: currentColor;
    }

    .spinner {
      width: 56px;
      height: 56px;
      border: 5px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: girar 0.9s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: rgba(255,255,255,0.8); }
    }

    @keyframes girar {
      to { transform: rotate(360deg); }
    }

    .btn-secundario {
      margin-top: 0.5rem;
      padding: 1rem 1.75rem;
      font-size: var(--fonte-base);
      font-weight: 600;
      font-family: inherit;
      border: 2px solid var(--cor-azul);
      background: #fff;
      color: var(--cor-azul);
      border-radius: 999px;
      cursor: pointer;
      min-height: 56px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-secundario:focus-visible {
      outline: 3px solid #90CAF9;
      outline-offset: 2px;
    }

    .btn-ouvir {
      padding: 0.65rem 1.25rem;
      font-size: clamp(18px, 4vw, 20px);
      margin-top: 0.75rem;
    }

    .passos-mic {
      text-align: left;
      max-width: 32ch;
      margin: 0 auto;
      font-size: var(--fonte-base);
    }

    .passos-mic ol {
      margin: 0.5rem 0 0;
      padding-left: 1.25rem;
    }

    .passos-mic li { margin-bottom: 0.5rem; }

    .modo-teste {
      width: 100%;
      max-width: 400px;
      display: none;
    }

    .modo-teste.ativo { display: block; }

    .modo-teste label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: var(--fonte-base);
    }

    .modo-teste textarea {
      width: 100%;
      min-height: 100px;
      font-size: var(--fonte-base);
      font-family: inherit;
      padding: 0.75rem;
      border-radius: 12px;
      border: 2px solid #B0BEC5;
    }

    .modo-teste .btn-secundario { width: 100%; }

    .aviso-teste {
      font-size: 18px;
      color: #546E7A;
      margin: 0 0 0.75rem;
    }

    .oculto { display: none !important; }

    .tela-senha {
      width: 100%;
      max-width: 600px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      text-align: center;
    }

    .tela-senha__titulo {
      font-size: var(--fonte-grande);
      font-weight: 600;
      margin: 0;
      max-width: 22ch;
    }

    .campo-senha {
      width: 100%;
      max-width: 320px;
      font-size: var(--fonte-base);
      font-family: inherit;
      padding: 1rem 1.125rem;
      border-radius: 14px;
      border: 2px solid #78909C;
      min-height: 56px;
    }

    .campo-senha:focus {
      outline: 3px solid #90CAF9;
      outline-offset: 2px;
      border-color: var(--cor-azul);
    }

    .erro-senha {
      color: var(--cor-alerta-texto);
      font-weight: 600;
      margin: 0;
      min-height: 1.5em;
    }

    .btn-entrar {
      padding: 1rem 2.5rem;
      font-size: var(--fonte-base);
      font-weight: 600;
      font-family: inherit;
      border: none;
      background: var(--cor-azul);
      color: #fff;
      border-radius: 999px;
      cursor: pointer;
      min-height: 56px;
      min-width: 200px;
      box-shadow: 0 6px 18px rgba(21, 101, 192, 0.3);
    }

    .btn-entrar:focus-visible {
      outline: 4px solid #90CAF9;
      outline-offset: 3px;
    }

    .aviso-config {
      font-size: var(--fonte-base);
      color: var(--cor-alerta-texto);
      max-width: 36ch;
    }
  </style>
</head>
<body>
  <section class="tela-senha" id="telaSenha" aria-labelledby="tituloSenha">
    <h1 class="tela-senha__titulo" id="tituloSenha">Digite a senha para entrar</h1>
    <p class="erro-senha" id="erroSenha" aria-live="polite"></p>
    <p class="aviso-config oculto" id="avisoConfig"></p>
    <form id="formSenha" class="tela-senha" style="width:100%;max-width:400px;gap:1rem;" autocomplete="off">
      <input
        type="password"
        class="campo-senha"
        id="inputSenha"
        name="senha"
        autocomplete="current-password"
        aria-label="Senha de acesso"
        inputmode="text"
      >
      <button type="submit" class="btn-entrar" id="btnEntrar">Entrar</button>
    </form>
  </section>

  <main class="app oculto" id="app" aria-hidden="true">
    <p class="instrucao" id="instrucao"></p>

    <div class="modo-teste" id="modoTeste">
      <p class="aviso-teste">Modo teste (sem microfone)</p>
      <label for="textoTeste">Digite o lembrete:</label>
      <textarea id="textoTeste" placeholder="Me lembrar de ligar pra ALFE no dia 15 do mes que vem"></textarea>
      <button type="button" class="btn-secundario" id="btnEnviarTeste">Enviar texto de teste</button>
    </div>

    <div class="area-mensagem area-mensagem--neutra" id="areaMensagem" aria-live="polite" aria-atomic="true"></div>

    <p class="cronometro oculto" id="cronometro" aria-hidden="true">0:00</p>

    <button type="button" class="btn-principal btn-principal--pronto" id="btnPrincipal" aria-label="Toque para gravar">
      <svg class="btn-icone-mic oculto" id="iconeMic" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
      <span class="spinner oculto" id="spinner"></span>
      <span id="textoBtn">Toque para gravar</span>
    </button>

    <div id="acoesSecundarias"></div>
  </main>

  <script src="config.js"></script>
  <script>
    /*
     * ARQUITETURA (padrão — tudo no navegador):
     *   Voz (Web Speech API) → interpretar data/tarefa (JS) → salvar (localStorage)
     *   → arquivo .ics → Calendário do celular manda o aviso.
     *
     * Opcional (futuro): preencha API_URL + TOKEN para um backend único
     * (transcrição + IA + e-mail). Deixe API_URL vazio para não usar.
     */
    if (typeof CONFIG === 'undefined') {
      var CONFIG = {
        SENHA: 'COLOCAR_SENHA_AQUI',
        API_URL: '',
        TOKEN: '',
        DURACAO_MAXIMA_SEG: 60,
        DURACAO_MINIMA_SEG: 1
      };
    }

    const CHAVE_SESSAO = 'lembretes_auth_v1';
    const CHAVE_LEMBRETES = 'meus_lembretes_v1';
    const FUSO = 'America/Sao_Paulo';

    const MIME_PREFERENCIA = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/mp4',
      'audio/ogg;codecs=opus'
    ];

    const ESTADO = {
      PRONTO: 'PRONTO',
      GRAVANDO: 'GRAVANDO',
      ENVIANDO: 'ENVIANDO',
      SUCESSO: 'SUCESSO',
      ERRO_BACKEND: 'ERRO_BACKEND',
      ERRO_REDE: 'ERRO_REDE',
      MICROFONE_NEGADO: 'MICROFONE_NEGADO',
      SEM_SUPORTE: 'SEM_SUPORTE'
    };

    const INSTRUCAO_PADRAO =
      'Fale o que você quer lembrar e quando. Exemplo: "Me lembra de tomar o remédio amanhã".';

    const params = new URLSearchParams(window.location.search);
    const modoTeste = params.get('teste') === '1';

    let estadoAtual = ESTADO.PRONTO;
    let mediaStream = null;
    let mediaRecorder = null;
    let chunks = [];
    let mimeTypeGravacao = 'audio/webm;codecs=opus';
    let inicioGravacaoMs = 0;
    let timerInterval = null;
    let timerMaximo = null;
    let timerMensagemEnviando = null;
    let ultimoPayload = null;
    let ultimaMensagemFala = '';
    let envioEmAndamento = false;
    let appIniciado = false;
    let reconhecimento = null;
    let textoFalaPartes = [];
    let modoGravacaoLocal = false;

    const el = {
      telaSenha: document.getElementById('telaSenha'),
      formSenha: document.getElementById('formSenha'),
      inputSenha: document.getElementById('inputSenha'),
      erroSenha: document.getElementById('erroSenha'),
      avisoConfig: document.getElementById('avisoConfig'),
      app: document.getElementById('app'),
      instrucao: document.getElementById('instrucao'),
      areaMensagem: document.getElementById('areaMensagem'),
      cronometro: document.getElementById('cronometro'),
      btnPrincipal: document.getElementById('btnPrincipal'),
      iconeMic: document.getElementById('iconeMic'),
      spinner: document.getElementById('spinner'),
      textoBtn: document.getElementById('textoBtn'),
      acoesSecundarias: document.getElementById('acoesSecundarias'),
      modoTeste: document.getElementById('modoTeste'),
      textoTeste: document.getElementById('textoTeste'),
      btnEnviarTeste: document.getElementById('btnEnviarTeste')
    };

    function senhaConfigurada() {
      return typeof CONFIG !== 'undefined' &&
        CONFIG.SENHA &&
        CONFIG.SENHA !== 'COLOCAR_SENHA_AQUI';
    }

    function hashSenha(texto) {
      if (!window.crypto || !crypto.subtle) {
        return Promise.resolve(String(texto));
      }
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(texto)))
        .then(function (buf) {
          return Array.from(new Uint8Array(buf))
            .map(function (b) { return b.toString(16).padStart(2, '0'); })
            .join('');
        });
    }

    function mostrarApp() {
      el.telaSenha.classList.add('oculto');
      el.app.classList.remove('oculto');
      el.app.setAttribute('aria-hidden', 'false');
    }

    function mostrarTelaSenha(mensagemErro) {
      el.app.classList.add('oculto');
      el.app.setAttribute('aria-hidden', 'true');
      el.telaSenha.classList.remove('oculto');
      el.erroSenha.textContent = mensagemErro || '';
      el.inputSenha.value = '';
      el.inputSenha.focus();
    }

    function liberarAcesso() {
      return hashSenha(CONFIG.SENHA).then(function (h) {
        try {
          sessionStorage.setItem(CHAVE_SESSAO, h);
        } catch (_) { /* ignore */ }
        mostrarApp();
        iniciarApp();
      });
    }

    function sessaoValida() {
      if (!senhaConfigurada()) return Promise.resolve(false);
      var salvo;
      try {
        salvo = sessionStorage.getItem(CHAVE_SESSAO);
      } catch (_) {
        return Promise.resolve(false);
      }
      if (!salvo) return Promise.resolve(false);
      return hashSenha(CONFIG.SENHA).then(function (h) { return salvo === h; });
    }

    function configurarPortaSenha() {
      if (typeof CONFIG === 'undefined') {
        el.formSenha.classList.add('oculto');
        el.avisoConfig.classList.remove('oculto');
        el.avisoConfig.textContent =
          'Falta o arquivo de configuração. Copie config.example.js para config.js ou publique com GitHub Actions.';
        return;
      }

      if (!senhaConfigurada()) {
        el.formSenha.classList.add('oculto');
        el.avisoConfig.classList.remove('oculto');
        el.avisoConfig.textContent =
          'A senha ainda não foi configurada. Defina SENHA no config.js ou nos secrets do repositório.';
        return;
      }

      el.formSenha.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var digitada = (el.inputSenha.value || '').trim();
        if (!digitada) {
          el.erroSenha.textContent = 'Digite a senha.';
          return;
        }
        if (digitada === CONFIG.SENHA) {
          el.erroSenha.textContent = '';
          liberarAcesso();
        } else {
          el.erroSenha.textContent = 'Senha incorreta. Tente de novo.';
          el.inputSenha.select();
        }
      });
    }

    function escolherMimeType() {
      if (typeof MediaRecorder === 'undefined') return null;
      for (const mime of MIME_PREFERENCIA) {
        if (MediaRecorder.isTypeSupported(mime)) return mime;
      }
      return null;
    }

    function navegadorSuportaGravacao() {
      return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
        typeof MediaRecorder !== 'undefined');
    }

    function ehIOS() {
      return /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    function ehSafari() {
      return /^((?!chrome|android).)*safari/i.test(navigator.userAgent) || ehIOS();
    }

    function formatarTempo(segundos) {
      const s = Math.floor(segundos);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return m + ':' + String(r).padStart(2, '0');
    }

    function limparTimersGravacao() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      if (timerMaximo) {
        clearTimeout(timerMaximo);
        timerMaximo = null;
      }
    }

    function limparTimerEnviando() {
      if (timerMensagemEnviando) {
        clearTimeout(timerMensagemEnviando);
        timerMensagemEnviando = null;
      }
    }

    function pararStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(function (t) { t.stop(); });
        mediaStream = null;
      }
    }

    function blobParaBase64(blob) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onloadend = function () {
          const result = reader.result;
          if (typeof result !== 'string') {
            reject(new Error('Leitura inválida'));
            return;
          }
          const idx = result.indexOf(',');
          resolve(idx >= 0 ? result.slice(idx + 1) : result);
        };
        reader.onerror = function () { reject(reader.error || new Error('Falha ao ler áudio')); };
        reader.readAsDataURL(blob);
      });
    }

    function falar(texto) {
      if (!window.speechSynthesis || !texto) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = 'pt-BR';
      u.rate = 0.95;
      const vozes = window.speechSynthesis.getVoices();
      const pt = vozes.find(function (v) {
        return v.lang && (v.lang.startsWith('pt-BR') || v.lang.startsWith('pt'));
      });
      if (pt) u.voice = pt;
      window.speechSynthesis.speak(u);
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = function () {};
    }

    function cfg(nome, padrao) {
      if (typeof CONFIG === 'undefined' || CONFIG[nome] === undefined || CONFIG[nome] === null) {
        return padrao;
      }
      return CONFIG[nome];
    }

    function apiAtiva() {
      const url = String(cfg('API_URL', '') || '').trim();
      return url.length > 0 && url !== 'DESATIVADO';
    }

    function reconhecimentoDisponivel() {
      return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    }

    function agoraNoFuso() {
      return new Date(new Date().toLocaleString('en-US', { timeZone: FUSO }));
    }

    function dataISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dia = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + dia;
    }

    function somarDias(d, n) {
      const x = new Date(d.getTime());
      x.setDate(x.getDate() + n);
      return x;
    }

    function proximoDiaSemana(d, diaDom0) {
      const x = new Date(d.getTime());
      let diff = diaDom0 - x.getDay();
      if (diff <= 0) diff += 7;
      return somarDias(x, diff);
    }

    const MAPA_DIAS = [
      ['domingo', 0], ['segunda', 1], ['terça', 2], ['terca', 2],
      ['quarta', 3], ['quinta', 4], ['sexta', 5], ['sábado', 6], ['sabado', 6]
    ];

    const DIAS_EXT = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
    const MESES_EXT = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

    function extrairDataDoTexto(texto) {
      const t = texto.toLowerCase();
      const hoje = agoraNoFuso();
      if (/\bhoje\b/.test(t)) return dataISO(hoje);
      if (/\bamanh[ãa]\b/.test(t)) return dataISO(somarDias(hoje, 1));
      if (/depois de amanh[ãa]/.test(t)) return dataISO(somarDias(hoje, 2));
      let i;
      for (i = 0; i < MAPA_DIAS.length; i++) {
        if (t.indexOf(MAPA_DIAS[i][0]) >= 0) {
          return dataISO(proximoDiaSemana(hoje, MAPA_DIAS[i][1]));
        }
      }
      const diaMes = t.match(/\bdia\s+(\d{1,2})\b/);
      if (diaMes) {
        const diaNum = parseInt(diaMes[1], 10);
        let cand = new Date(hoje.getFullYear(), hoje.getMonth(), diaNum, 12, 0, 0);
        if (cand < hoje) cand = new Date(hoje.getFullYear(), hoje.getMonth() + 1, diaNum, 12, 0, 0);
        return dataISO(cand);
      }
      return null;
    }

    function extrairHoraDoTexto(texto) {
      const m = texto.match(/(?:às|as|a)\s*(\d{1,2})(?:(?:[:h]\s*(\d{2}))|(?:\s*(?:e|)\s*(?:meia|(\d{2}))\s*(?:minuto)?)?)?/i);
      if (!m) return '';
      let hh = parseInt(m[1], 10);
      let mm = m[2] || m[3] || '00';
      if (/meia/i.test(texto) && !m[2]) mm = '30';
      if (hh > 23) return '';
      return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    }

    function extrairTarefaDoTexto(texto) {
      let s = String(texto).trim();
      s = s.replace(/^(me\s+)?(lembra|lembrar)(me)?(\s+de)?\s*/i, '');
      s = s.replace(/\s+(por favor\.?|t[aá]\.?|ok\.?)$/i, '');
      return s.trim() || String(texto).trim();
    }

    function dataPorExtenso(iso) {
      const p = iso.split('-').map(Number);
      const dt = new Date(p[0], p[1] - 1, p[2], 12);
      return DIAS_EXT[dt.getDay()] + ', ' + p[2] + ' de ' + MESES_EXT[p[1] - 1];
    }

    function montarMensagemOk(lembretes) {
      const partes = lembretes.map(function (l) {
        let s = l.tarefa.charAt(0).toLowerCase() + l.tarefa.slice(1);
        s += ' na ' + dataPorExtenso(l.data);
        if (l.hora) s += ', às ' + l.hora;
        return s;
      });
      return 'Anotado! ✅ Vou te lembrar de ' + partes.join('; e de ') +
        '. Toque em “Colocar no calendário” para o celular avisar na hora certa.';
    }

    function interpretarLocal(texto) {
      const bruto = String(texto || '').trim();
      if (!bruto) {
        return { ok: false, mensagem: 'Não ouvi nada. Fale mais perto do celular e tente de novo.' };
      }
      const data = extrairDataDoTexto(bruto);
      const tarefa = extrairTarefaDoTexto(bruto);
      const hora = extrairHoraDoTexto(bruto);
      if (!data) {
        return {
          ok: false,
          texto: bruto,
          mensagem: 'Entendi o lembrete, mas não entendi PARA QUANDO. Fale de novo com “amanhã”, “sexta” ou “dia 15”.'
        };
      }
      const item = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        tarefa: tarefa,
        data: data,
        hora: hora,
        texto: bruto,
        criadoEm: new Date().toISOString()
      };
      return { ok: true, texto: bruto, lembretes: [item], mensagem: montarMensagemOk([item]) };
    }

    function salvarLembretesLocal(lembretes) {
      let lista = [];
      try {
        lista = JSON.parse(localStorage.getItem(CHAVE_LEMBRETES) || '[]');
      } catch (_) {
        lista = [];
      }
      lembretes.forEach(function (l) { lista.push(l); });
      try {
        localStorage.setItem(CHAVE_LEMBRETES, JSON.stringify(lista));
      } catch (e) {
        console.error(e);
      }
    }

    function escapeIcs(s) {
      return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
    }

    function gerarArquivoIcs(lembretes) {
      const linhas = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Meus Lembretes//PT',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH'
      ];
      lembretes.forEach(function (l) {
        const p = l.data.split('-');
        linhas.push('BEGIN:VEVENT');
        linhas.push('UID:' + l.id + '@meus-lembretes');
        if (l.hora) {
          const hm = l.hora.split(':');
          const inicio = p[0] + p[1] + p[2] + 'T' + hm[0] + hm[1] + '00';
          linhas.push('DTSTART;TZID=' + FUSO + ':' + inicio);
          const fimH = String((parseInt(hm[0], 10) + 1) % 24).padStart(2, '0');
          linhas.push('DTEND;TZID=' + FUSO + ':' + p[0] + p[1] + p[2] + 'T' + fimH + hm[1] + '00');
        } else {
          linhas.push('DTSTART;VALUE=DATE:' + p[0] + p[1] + p[2]);
          linhas.push('DTEND;VALUE=DATE:' + p[0] + p[1] + p[2]);
        }
        linhas.push('SUMMARY:' + escapeIcs(l.tarefa));
        linhas.push('DESCRIPTION:' + escapeIcs('Lembrete criado por voz'));
        linhas.push('BEGIN:VALARM');
        linhas.push('TRIGGER:-PT15M');
        linhas.push('ACTION:DISPLAY');
        linhas.push('DESCRIPTION:Lembrete');
        linhas.push('END:VALARM');
        linhas.push('END:VEVENT');
      });
      linhas.push('END:VCALENDAR');
      return linhas.join('\r\n');
    }

    function baixarIcs(lembretes) {
      const conteudo = gerarArquivoIcs(lembretes);
      const blob = new Blob([conteudo], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'lembrete.ics';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }

    function processarTextoLocal(texto) {
      if (envioEmAndamento) return;
      envioEmAndamento = true;
      renderizarEstado(ESTADO.ENVIANDO, {});
      window.setTimeout(function () {
        try {
          const r = interpretarLocal(texto);
          envioEmAndamento = false;
          if (r.ok) {
            salvarLembretesLocal(r.lembretes);
            renderizarEstado(ESTADO.SUCESSO, {
              mensagem: r.mensagem,
              texto: r.texto,
              lembretes: r.lembretes
            });
          } else {
            renderizarEstado(ESTADO.ERRO_BACKEND, { mensagem: r.mensagem, texto: r.texto || '' });
          }
        } catch (err) {
          console.error(err);
          envioEmAndamento = false;
          renderizarEstado(ESTADO.ERRO_BACKEND, {
            mensagem: 'Não consegui anotar. Tente falar de novo, bem devagar.'
          });
        }
      }, 400);
    }

    function processarEntrada(texto) {
      if (apiAtiva()) {
        return enviar({ token: cfg('TOKEN', ''), texto: texto });
      }
      processarTextoLocal(texto);
    }

    function pararReconhecimento() {
      if (reconhecimento) {
        try { reconhecimento.stop(); } catch (_) { /* ignore */ }
        reconhecimento = null;
      }
    }

    async function enviar(payload) {
      if (!apiAtiva()) {
        if (payload.texto) processarTextoLocal(payload.texto);
        return;
      }
      if (envioEmAndamento) return;
      envioEmAndamento = true;
      ultimoPayload = payload;
      renderizarEstado(ESTADO.ENVIANDO, {});

      const controller = new AbortController();
      const timeoutId = setTimeout(function () { controller.abort(); }, 60000);

      try {
        // Corpo como Blob text/plain sem charset evita preflight OPTIONS (GAS não responde OPTIONS).
        const corpo = new Blob([JSON.stringify(payload)], { type: 'text/plain' });
        const res = await fetch(CONFIG.API_URL, {
          method: 'POST',
          body: corpo,
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        let data;
        try {
          data = await res.json();
        } catch (parseErr) {
          console.error(parseErr);
          renderizarEstado(ESTADO.ERRO_REDE, {});
          return;
        }

        if (data.ok) {
          renderizarEstado(ESTADO.SUCESSO, {
            mensagem: data.mensagem || 'Pronto!',
            texto: data.texto || ''
          });
        } else {
          console.error(data.erro);
          renderizarEstado(ESTADO.ERRO_BACKEND, {
            mensagem: data.mensagem || 'Não deu para anotar desta vez. Tente falar de novo.'
          });
        }
      } catch (err) {
        clearTimeout(timeoutId);
        console.error(err);
        renderizarEstado(ESTADO.ERRO_REDE, {});
      } finally {
        envioEmAndamento = false;
      }
    }

    function enviarBlob(blob, mime) {
      return blobParaBase64(blob).then(function (base64) {
        return enviar({
          token: CONFIG.TOKEN,
          audio: base64,
          mimeType: mime || blob.type || mimeTypeGravacao
        });
      });
    }

    function iniciarGravacao() {
      const mimeEscolhido = escolherMimeType();
      const opcoes = mimeEscolhido ? { mimeType: mimeEscolhido } : undefined;

      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function (stream) {
          mediaStream = stream;
          chunks = [];
          try {
            mediaRecorder = opcoes
              ? new MediaRecorder(stream, opcoes)
              : new MediaRecorder(stream);
          } catch (e) {
            console.error(e);
            pararStream();
            renderizarEstado(ESTADO.SEM_SUPORTE, {});
            return;
          }

          mimeTypeGravacao = mediaRecorder.mimeType || mimeEscolhido || 'audio/webm';

          mediaRecorder.ondataavailable = function (ev) {
            if (ev.data && ev.data.size > 0) chunks.push(ev.data);
          };

          mediaRecorder.onstop = function () {
            limparTimersGravacao();
            const duracaoSeg = (Date.now() - inicioGravacaoMs) / 1000;
            pararStream();

            if (duracaoSeg < cfg('DURACAO_MINIMA_SEG', 1)) {
              renderizarEstado(ESTADO.PRONTO, { avisoCurto: true });
              return;
            }

            if (modoGravacaoLocal) {
              modoGravacaoLocal = false;
              pararReconhecimento();
              const texto = textoFalaPartes.join(' ').trim();
              textoFalaPartes = [];
              processarTextoLocal(texto);
              return;
            }

            const blob = new Blob(chunks, { type: mimeTypeGravacao });
            chunks = [];
            enviarBlob(blob, mimeTypeGravacao).catch(function (err) {
              console.error(err);
              renderizarEstado(ESTADO.ERRO_REDE, {});
            });
          };

          mediaRecorder.onerror = function (ev) {
            console.error(ev.error || ev);
            limparTimersGravacao();
            pararStream();
            renderizarEstado(ESTADO.PRONTO, {
              aviso: 'Algo deu errado na gravação. Toque para tentar de novo.'
            });
          };

          inicioGravacaoMs = Date.now();
          mediaRecorder.start(250);

          if (navigator.vibrate) {
            try { navigator.vibrate(80); } catch (_) { /* ignore */ }
          }

          renderizarEstado(ESTADO.GRAVANDO, {});

          timerInterval = setInterval(function () {
            const seg = (Date.now() - inicioGravacaoMs) / 1000;
            el.cronometro.textContent = formatarTempo(seg);
          }, 200);

          timerMaximo = setTimeout(function () {
            pararGravacao();
          }, cfg('DURACAO_MAXIMA_SEG', 60) * 1000);
        })
        .catch(function (err) {
          console.error(err);
          pararStream();
          pararReconhecimento();
          if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            renderizarEstado(ESTADO.MICROFONE_NEGADO, {});
          } else {
            renderizarEstado(ESTADO.PRONTO, {
              aviso: 'Não consegui usar o microfone. Toque para tentar de novo.'
            });
          }
        });
    }

    function iniciarGravacaoLocal() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        renderizarEstado(ESTADO.SEM_SUPORTE, {});
        return;
      }

      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function (stream) {
          mediaStream = stream;
          chunks = [];
          textoFalaPartes = [];
          modoGravacaoLocal = true;

          const mimeEscolhido = escolherMimeType();
          try {
            mediaRecorder = mimeEscolhido
              ? new MediaRecorder(stream, { mimeType: mimeEscolhido })
              : new MediaRecorder(stream);
          } catch (e) {
            mediaRecorder = null;
          }
          mimeTypeGravacao = (mediaRecorder && mediaRecorder.mimeType) || mimeEscolhido || 'audio/webm';

          if (mediaRecorder) {
            mediaRecorder.ondataavailable = function () { /* só cronômetro / duração mínima */ };
            mediaRecorder.onstop = function () {
              limparTimersGravacao();
              const duracaoSeg = (Date.now() - inicioGravacaoMs) / 1000;
              pararStream();
              if (duracaoSeg < cfg('DURACAO_MINIMA_SEG', 1)) {
                modoGravacaoLocal = false;
                pararReconhecimento();
                textoFalaPartes = [];
                renderizarEstado(ESTADO.PRONTO, { avisoCurto: true });
                return;
              }
              modoGravacaoLocal = false;
              pararReconhecimento();
              const texto = textoFalaPartes.join(' ').trim();
              textoFalaPartes = [];
              processarTextoLocal(texto);
            };
            mediaRecorder.onerror = function () {
              limparTimersGravacao();
              pararStream();
              pararReconhecimento();
              modoGravacaoLocal = false;
              renderizarEstado(ESTADO.PRONTO, { aviso: 'Algo deu errado na gravação. Toque para tentar de novo.' });
            };
          }

          reconhecimento = new SpeechRecognition();
          reconhecimento.lang = 'pt-BR';
          reconhecimento.continuous = true;
          reconhecimento.interimResults = true;
          reconhecimento.onresult = function (ev) {
            for (let i = ev.resultIndex; i < ev.results.length; i++) {
              if (ev.results[i].isFinal) {
                textoFalaPartes.push(ev.results[i][0].transcript);
              }
            }
          };
          reconhecimento.onerror = function (ev) {
            console.error(ev.error || ev);
          };

          inicioGravacaoMs = Date.now();
          try {
            reconhecimento.start();
          } catch (err) {
            console.error(err);
          }
          if (mediaRecorder) {
            try { mediaRecorder.start(250); } catch (_) { /* ignore */ }
          }

          if (navigator.vibrate) {
            try { navigator.vibrate(80); } catch (_) { /* ignore */ }
          }

          renderizarEstado(ESTADO.GRAVANDO, {});

          timerInterval = setInterval(function () {
            const seg = (Date.now() - inicioGravacaoMs) / 1000;
            el.cronometro.textContent = formatarTempo(seg);
          }, 200);

          timerMaximo = setTimeout(function () {
            pararGravacao();
          }, cfg('DURACAO_MAXIMA_SEG', 60) * 1000);
        })
        .catch(function (err) {
          console.error(err);
          pararStream();
          pararReconhecimento();
          if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            renderizarEstado(ESTADO.MICROFONE_NEGADO, {});
          } else {
            renderizarEstado(ESTADO.PRONTO, {
              aviso: 'Não consegui usar o microfone. Toque para tentar de novo.'
            });
          }
        });
    }

    function pararGravacao() {
      if (modoGravacaoLocal) {
        pararReconhecimento();
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          try { mediaRecorder.stop(); } catch (e) {
            console.error(e);
            limparTimersGravacao();
            pararStream();
            modoGravacaoLocal = false;
            const texto = textoFalaPartes.join(' ').trim();
            textoFalaPartes = [];
            if (texto) processarTextoLocal(texto);
            else renderizarEstado(ESTADO.PRONTO, {});
          }
        } else {
          limparTimersGravacao();
          pararStream();
          modoGravacaoLocal = false;
          const texto = textoFalaPartes.join(' ').trim();
          textoFalaPartes = [];
          if (texto) processarTextoLocal(texto);
          else renderizarEstado(ESTADO.PRONTO, { aviso: 'Não ouvi nada. Tente falar de novo.' });
        }
        return;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try {
          mediaRecorder.stop();
        } catch (e) {
          console.error(e);
          limparTimersGravacao();
          pararStream();
          renderizarEstado(ESTADO.PRONTO, {});
        }
      }
    }

    function renderizarEstado(estado, dados) {
      estadoAtual = estado;
      dados = dados || {};
      limparTimerEnviando();
      el.acoesSecundarias.innerHTML = '';

      el.areaMensagem.className = 'area-mensagem area-mensagem--neutra';
      el.areaMensagem.innerHTML = '';
      el.instrucao.classList.remove('oculto');
      el.cronometro.classList.add('oculto');
      el.btnPrincipal.disabled = false;
      el.btnPrincipal.className = 'btn-principal';
      el.iconeMic.classList.add('oculto');
      el.spinner.classList.add('oculto');

      switch (estado) {
        case ESTADO.PRONTO:
          el.instrucao.textContent = INSTRUCAO_PADRAO;
          el.instrucao.classList.remove('oculto');
          if (dados.avisoCurto) {
            el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
            el.areaMensagem.innerHTML =
              '<p class="mensagem-principal">Foi rapidinho demais. Toque no botão, fale o lembrete e toque de novo para terminar.</p>';
          } else if (dados.aviso) {
            el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
            el.areaMensagem.innerHTML =
              '<p class="mensagem-principal">' + escapeHtml(dados.aviso) + '</p>';
          }
          el.btnPrincipal.classList.add('btn-principal--pronto');
          el.iconeMic.classList.remove('oculto');
          el.textoBtn.textContent = 'Toque para gravar';
          el.btnPrincipal.setAttribute('aria-label', 'Toque para gravar');
          break;

        case ESTADO.GRAVANDO:
          el.instrucao.classList.add('oculto');
          el.cronometro.classList.remove('oculto');
          el.cronometro.textContent = '0:00';
          el.btnPrincipal.classList.add('btn-principal--gravando');
          el.iconeMic.classList.remove('oculto');
          el.textoBtn.textContent = 'Toque para terminar';
          el.btnPrincipal.setAttribute('aria-label', 'Toque para terminar a gravação');
          break;

        case ESTADO.ENVIANDO:
          el.instrucao.classList.add('oculto');
          el.btnPrincipal.disabled = true;
          el.btnPrincipal.classList.add('btn-principal--enviando');
          el.spinner.classList.remove('oculto');
          el.textoBtn.textContent = apiAtiva() ? 'Anotando seu lembrete…' : 'Entendendo o que você falou…';
          el.btnPrincipal.setAttribute('aria-label', 'Processando lembrete');
          timerMensagemEnviando = setTimeout(function () {
            if (estadoAtual === ESTADO.ENVIANDO) {
              el.textoBtn.textContent = 'Só mais um pouquinho…';
            }
          }, 10000);
          break;

        case ESTADO.SUCESSO: {
          el.instrucao.classList.add('oculto');
          el.btnPrincipal.classList.add('oculto');
          el.areaMensagem.className = 'area-mensagem area-mensagem--sucesso';
          const msg = dados.mensagem || '';
          const ouvi = dados.texto || '';
          let html = '<div class="icone-sucesso" aria-hidden="true">✅</div>';
          html += '<p class="mensagem-principal">' + escapeHtml(msg) + '</p>';
          if (ouvi) {
            html += '<p class="mensagem-ouvi">Eu ouvi: “' + escapeHtml(ouvi) + '”</p>';
          }
          el.areaMensagem.innerHTML = html;

          ultimaMensagemFala = msg;
          falar(msg);

          const btnOutro = document.createElement('button');
          btnOutro.type = 'button';
          btnOutro.className = 'btn-secundario';
          btnOutro.textContent = 'Gravar outro lembrete';
          btnOutro.addEventListener('click', function () {
            window.speechSynthesis && window.speechSynthesis.cancel();
            renderizarEstado(ESTADO.PRONTO, {});
            el.btnPrincipal.classList.remove('oculto');
          });

          const btnOuvir = document.createElement('button');
          btnOuvir.type = 'button';
          btnOuvir.className = 'btn-secundario btn-ouvir';
          btnOuvir.textContent = '🔊 Ouvir de novo';
          btnOuvir.addEventListener('click', function () {
            falar(ultimaMensagemFala);
          });

          el.acoesSecundarias.appendChild(btnOutro);
          el.acoesSecundarias.appendChild(btnOuvir);

          if (dados.lembretes && dados.lembretes.length) {
            const btnCal = document.createElement('button');
            btnCal.type = 'button';
            btnCal.className = 'btn-secundario';
            btnCal.textContent = '📅 Colocar no calendário';
            btnCal.addEventListener('click', function () {
              baixarIcs(dados.lembretes);
            });
            el.acoesSecundarias.appendChild(btnCal);
          }
          break;
        }

        case ESTADO.ERRO_BACKEND:
          el.instrucao.classList.add('oculto');
          el.btnPrincipal.classList.add('oculto');
          el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
          el.areaMensagem.innerHTML =
            '<p class="mensagem-principal">' + escapeHtml(dados.mensagem || 'Não deu desta vez.') + '</p>';
          adicionarBotaoSecundario('Tentar de novo', function () {
            renderizarEstado(ESTADO.PRONTO, {});
            el.btnPrincipal.classList.remove('oculto');
          });
          break;

        case ESTADO.ERRO_REDE:
          el.instrucao.classList.add('oculto');
          el.btnPrincipal.classList.add('oculto');
          el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
          el.areaMensagem.innerHTML =
            '<p class="mensagem-principal">Não consegui enviar. Verifique se a internet está ligada.</p>';
          adicionarBotaoSecundario('Enviar de novo', function () {
            if (ultimoPayload) {
              enviar(ultimoPayload);
            } else {
              renderizarEstado(ESTADO.PRONTO, {});
              el.btnPrincipal.classList.remove('oculto');
            }
          });
          break;

        case ESTADO.MICROFONE_NEGADO:
          el.instrucao.classList.add('oculto');
          el.btnPrincipal.classList.add('oculto');
          el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
          el.areaMensagem.innerHTML = '<p class="mensagem-principal">Preciso do microfone para ouvir seu lembrete.</p>' +
            textoPassosMicrofone();
          adicionarBotaoSecundario('Tentar de novo', function () {
            renderizarEstado(ESTADO.PRONTO, {});
            el.btnPrincipal.classList.remove('oculto');
          });
          break;

        case ESTADO.SEM_SUPORTE:
          el.instrucao.classList.add('oculto');
          el.btnPrincipal.classList.add('oculto');
          el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
          el.areaMensagem.innerHTML =
            '<p class="mensagem-principal">Este navegador não consegue gravar. Abra este link no Chrome (Android) ou Safari (iPhone).</p>';
          break;

        default:
          renderizarEstado(ESTADO.PRONTO, {});
      }
    }

    function adicionarBotaoSecundario(texto, aoClicar) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-secundario';
      btn.textContent = texto;
      btn.addEventListener('click', aoClicar);
      el.acoesSecundarias.appendChild(btn);
    }

    function textoPassosMicrofone() {
      if (ehSafari() || ehIOS()) {
        return (
          '<div class="passos-mic"><p>No iPhone:</p><ol>' +
          '<li>Toque o ícone <strong>AA</strong> ou o cadeado na barra de endereço.</li>' +
          '<li>Escolha <strong>Configurações do site</strong> ou <strong>Microfone</strong>.</li>' +
          '<li>Permita o microfone para este site.</li>' +
          '<li>Toque em <strong>Tentar de novo</strong> abaixo.</li></ol></div>'
        );
      }
      return (
        '<div class="passos-mic"><p>No Android:</p><ol>' +
        '<li>Toque o cadeado ao lado do endereço do site.</li>' +
        '<li>Toque em <strong>Permissões</strong>.</li>' +
        '<li>Ative o <strong>Microfone</strong>.</li>' +
        '<li>Toque em <strong>Tentar de novo</strong> abaixo.</li></ol></div>'
      );
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function aoClicarPrincipal() {
      if (modoTeste) return;
      if (estadoAtual === ESTADO.ENVIANDO) return;

      if (estadoAtual === ESTADO.PRONTO) {
        if (!apiAtiva()) {
          if (!reconhecimentoDisponivel()) {
            renderizarEstado(ESTADO.SEM_SUPORTE, {});
            return;
          }
          iniciarGravacaoLocal();
          return;
        }
        if (!navegadorSuportaGravacao()) {
          renderizarEstado(ESTADO.SEM_SUPORTE, {});
          return;
        }
        iniciarGravacao();
      } else if (estadoAtual === ESTADO.GRAVANDO) {
        pararGravacao();
      }
    }

    function iniciarApp() {
      if (appIniciado) return;
      appIniciado = true;
      el.btnPrincipal.addEventListener('click', aoClicarPrincipal);

      if (modoTeste) {
        el.modoTeste.classList.add('ativo');
        el.btnPrincipal.classList.add('oculto');
        el.instrucao.textContent = 'Modo teste: digite um lembrete e envie sem gravar.';
        el.btnEnviarTeste.addEventListener('click', function () {
          if (estadoAtual === ESTADO.ENVIANDO) return;
          const texto = (el.textoTeste.value || '').trim();
          if (!texto) {
            el.areaMensagem.className = 'area-mensagem area-mensagem--alerta';
            el.areaMensagem.innerHTML =
              '<p class="mensagem-principal">Digite uma frase de lembrete no campo acima.</p>';
            return;
          }
          processarEntrada(texto);
        });
      } else if (!apiAtiva() && !reconhecimentoDisponivel()) {
        renderizarEstado(ESTADO.SEM_SUPORTE, {});
      } else if (apiAtiva() && !navegadorSuportaGravacao()) {
        renderizarEstado(ESTADO.SEM_SUPORTE, {});
      } else {
        if (!apiAtiva()) {
          el.instrucao.textContent =
            'Fale o lembrete e o dia. Exemplo: “Me lembra de tomar o remédio amanhã”. Depois coloque no calendário do celular.';
        }
        renderizarEstado(ESTADO.PRONTO, {});
      }
    }

    configurarPortaSenha();
    sessaoValida().then(function (ok) {
      if (ok) {
        mostrarApp();
        iniciarApp();
      }
    });
  </script>
</body>
</html>
