name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar config.js (Secrets ou Variables)
        env:
          # Secrets têm prioridade; Variables servem se você criou lá por engano
          API_URL: ${{ secrets.API_URL || vars.API_URL }}
          TOKEN: ${{ secrets.TOKEN || vars.TOKEN }}
          SENHA: ${{ secrets.SENHA || vars.SENHA }}
        run: node scripts/generate-config.js

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
