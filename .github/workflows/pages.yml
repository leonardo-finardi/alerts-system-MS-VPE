name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Secrets de environment só existem no job que declara esse nome.
    # Os seus estão em "envs" (não em github-pages). Ajuste se mudar no GitHub.
    environment: envs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar config.js (Secrets ou Variables)
        env:
          API_URL: ${{ secrets.API_URL || vars.API_URL }}
          TOKEN: ${{ secrets.TOKEN || vars.TOKEN }}
          SENHA: ${{ secrets.SENHA || vars.SENHA }}
        run: node scripts/generate-config.js

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
