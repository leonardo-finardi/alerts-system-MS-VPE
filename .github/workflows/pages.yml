name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar config.js a partir dos secrets
        env:
          API_URL: ${{ secrets.API_URL }}
          TOKEN: ${{ secrets.TOKEN }}
          SENHA: ${{ secrets.SENHA }}
        run: |
          node -e "
          const fs = require('fs');
          for (const k of ['API_URL', 'TOKEN', 'SENHA']) {
            if (!process.env[k]) {
              console.error('Secret ausente: ' + k);
              process.exit(1);
            }
          }
          const CONFIG = {
            API_URL: process.env.API_URL,
            TOKEN: process.env.TOKEN,
            SENHA: process.env.SENHA,
            DURACAO_MAXIMA_SEG: 60,
            DURACAO_MINIMA_SEG: 1
          };
          fs.writeFileSync('config.js', 'const CONFIG = ' + JSON.stringify(CONFIG, null, 2) + ';\\n');
          "

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
